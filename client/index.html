<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Chat App</title>
    <script>
      // The UI scale and font, applied before the first paint so there is no flash of the wrong size or
      // font. The stylesheet is in rem and scales from --ui-scale, and reads the font from --ui-font (the
      // whole UI) or --message-font (messages only). See src/lib/appearance.ts, which this must match:
      // src/appearanceScript.test.ts runs this script against it. Scale is a stored percent, or "Auto",
      // which is chosen from the screen's width.
      (function () {
        var stored = null;
        try {
          stored = JSON.parse(localStorage.getItem("chat.appearance"));
        } catch (e) {}
        if (!stored || typeof stored !== "object") stored = {};
        var style = document.documentElement.style;

        var steps = [75, 90, 100, 110, 125, 150, 175, 200];
        var percent = steps.indexOf(stored.scale) !== -1 ? stored.scale : 0;
        if (!percent) {
          var width = window.screen.width;
          percent = width >= 3200 ? 150 : width >= 2400 ? 125 : 100;
        }
        style.setProperty("--ui-scale", String(percent / 100));

        var DEFAULT_STACK = '"Segoe UI", system-ui, -apple-system, sans-serif';
        var MONO_STACK = '"Cascadia Code", "Cascadia Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace';
        var bundled = { "jetbrains-mono": "JetBrains Mono", "ibm-plex-mono": "IBM Plex Mono", "fira-code": "Fira Code" };
        var custom = typeof stored.customFont === "string" ? stored.customFont.trim().replace(/\s+/g, " ") : "";
        if (!/^[\p{L}\p{N} ._-]{1,64}$/u.test(custom)) custom = "";
        var stack = null;
        if (stored.font === "mono-system") stack = MONO_STACK;
        else if (Object.prototype.hasOwnProperty.call(bundled, stored.font)) stack = '"' + bundled[stored.font] + '", ' + MONO_STACK;
        else if (stored.font === "custom" && custom) stack = '"' + custom + '", ' + DEFAULT_STACK;
        var ligatures = stack !== null && stored.ligatures !== true ? "none" : null;
        var wholeUi = stored.fontScope !== "messages";
        function put(name, value) {
          if (value === null) style.removeProperty(name);
          else style.setProperty(name, value);
        }
        put("--ui-font", wholeUi ? stack : null);
        put("--font-ligatures", wholeUi ? ligatures : null);
        put("--message-font", wholeUi ? null : stack);
        put("--message-ligatures", wholeUi ? null : ligatures);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // During a rolling upgrade a page can ask the pod that answers for a hashed file only the
      // other build has (it answers 404), leaving a blank page until someone reloads. Reload
      // for the current index.html instead - at most 5 times a minute, so a file that is
      // really missing cannot cause a reload loop. Covers the entry script, the stylesheet
      // and, through Vite's preload event, the lazily loaded chunks.
      (function () {
        function reloadOnce() {
          try {
            var now = Date.now();
            var recent = JSON.parse(sessionStorage.getItem("chat.assetReloads") || "[]").filter(function (t) {
              return now - t < 60000;
            });
            if (recent.length >= 5) return;
            recent.push(now);
            sessionStorage.setItem("chat.assetReloads", JSON.stringify(recent));
          } catch (e) {
            return;
          }
          location.reload();
        }
        // A failed <script>/<link> load does not bubble, so listen in the capture phase.
        window.addEventListener(
          "error",
          function (event) {
            var el = event.target;
            if (!el || (el.tagName !== "SCRIPT" && el.tagName !== "LINK")) return;
            if ((el.src || el.href || "").indexOf("/assets/") === -1) return;
            reloadOnce();
          },
          true
        );
        window.addEventListener("vite:preloadError", reloadOnce);
      })();
    </script>
    <script src="/env-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
