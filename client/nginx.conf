server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't let the browser cache env-config.js - it's regenerated per
    # container start (see docker-entrypoint.sh) and must always be fetched
    # fresh, or a client could run with a stale API_URL after a redeploy.
    location = /env-config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Client-side routing (react-router-dom) - any path that isn't a real
    # file falls back to index.html so deep links work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
