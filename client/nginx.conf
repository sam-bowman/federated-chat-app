server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The Server header says which nginx this is, which helps nobody but someone looking for a known flaw.
    server_tokens off;

    # The browser-hardening headers (a Content-Security-Policy, nosniff, no framing, ...; #281). The file is generated in the image build from
    # the built index.html (client/scripts/security-headers.mjs), because the policy names the page's inline scripts by hash.
    #
    # It is included in EVERY location below as well as here: nginx does not inherit `add_header` into a location that has an
    # `add_header` of its own, so without that a response from `/assets/` or `/` would silently have none of them.
    include /etc/nginx/security-headers.conf;

    # Don't let the browser cache env-config.js - it's regenerated per
    # container start (see docker-entrypoint.sh) and must always be fetched
    # fresh, or a client could run with a stale API_URL after a redeploy.
    location = /env-config.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Everything under /assets/ has a content hash in its name (Vite), so a given URL never
    # changes and can be cached for good. It must NOT fall back to index.html when missing:
    # during a rolling upgrade a browser can ask a pod for a file only the other build has,
    # and answering that with index.html (status 200, text/html) is a blank page with a MIME
    # error. A real 404 lets index.html's recovery script reload for the current page.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routing (react-router-dom) - any path that isn't a real
    # file falls back to index.html so deep links work on refresh.
    #
    # no-cache means "ask again before reusing", not "never store": the browser revalidates
    # with the ETag (a 304 when nothing changed). index.html names the hashed files of ONE
    # build, so a copy cached across an upgrade points at files that no longer exist.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
