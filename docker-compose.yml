# Pinned so the container and volume names (my-chat-app-postgres-1,
# my-chat-app_postgres-data) do not depend on what folder this repo was cloned
# into - scripts/start.ps1 waits on the container by that exact name. Without it,
# Compose derives the project name from the folder, and a default `git clone`
# (federated-chat-app) never matches. docker-compose.selfhost.yml pins its own.
name: my-chat-app

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional - only needed to run more than one server replica (see
  # REDIS_URL in server/.env.example and docs/scaling.md "Running multiple
  # replicas"). Not started by scripts/start.ps1's single-instance flow.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Mapped to a non-default host port, same reasoning as Postgres below -
      # avoids colliding with a native Redis install on the dev machine.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional - only needed to try voice channels (#53): the LiveKit server the audio goes through. Not started by
  # scripts/start.ps1. Set LIVEKIT_URL=ws://localhost:7880, LIVEKIT_API_KEY=devkey and LIVEKIT_API_SECRET=devsecretdevsecretdevsecretdevsecret in
  # server/.env (the dev keys below), and run the server on :4000 so LiveKit's webhooks reach it
  # (host.docker.internal is the machine this runs on).
  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    ports:
      - "7880:7880" # signalling (websocket) and the API
      - "7881:7881" # media over TCP, for networks that block UDP
      - "7882:7882/udp" # media over UDP, all rooms on this one port
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LIVEKIT_KEYS: "devkey: devsecretdevsecretdevsecretdevsecret"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          node_ip: 127.0.0.1
        webhook:
          api_key: devkey
          urls:
            - http://host.docker.internal:4000/api/v1/voice/webhook

volumes:
  postgres-data:
