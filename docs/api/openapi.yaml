openapi: 3.1.0
info:
  title: Federated chat server REST API
  version: 0.16.0
  summary: The HTTP API a client uses to talk to its own home server.
  description: |
    This is the API of ONE homeserver, which its own clients (the web client, the desktop app) use for everything: accounts,
    friends, direct messages, communities, channels, emoticons, uploads and notification settings. It is served under
    `/api/v1` of the server's API address. Live events (new messages, presence, calls) come over a WebSocket at `/ws`, not
    documented here (see `docs/spec.md`). Servers talk to each other over a separate, signed protocol
    (`/federation/v1`, see `protocol/federation.md`), which is not part of this document.

    **Identifiers.** Every id in a request or response is the object's `protocolId` (a ULID), never a database id. A person is
    also named by an *identity*, `@username:domain`.

    **Authentication.** Sign in with `POST /auth/login` (or `/auth/register`) to get an **access token** (valid 15 minutes) and a
    **refresh token** (rotated on use). Send the access token as `Authorization: Bearer <token>`. When it expires, `POST
    /auth/refresh` returns a new pair. Every operation below says whether it needs one. A request without one gets `401
    {"error":"missing_token"}`, an expired or invalid one `401 {"error":"invalid_token"}`.

    **Errors.** A failure is a JSON body `{"error": "<code>"}` (a bad request may add `details`), with the HTTP status that fits.
    The codes are stable: clients should branch on them, not on the text. Codes that an operation can return are listed with it.

    **Limits.** Requests are rate limited per client address (a stricter limit on sign-in and other password checks): the
    answer is `429`. Request bodies are JSON unless the operation says otherwise.

    **Remote people and communities.** A person or community may live on another server. Where an operation behaves differently
    for them (it is proxied to their server, or refused) it says so.

    This file is checked by the test suite against the routes the server really has, so an operation cannot be added or
    removed without it. `docs/api/reference.md` is generated from it.
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only
servers:
  - url: https://chat.example.com/api/v1
    description: Your server's API address (the address its clients are configured with) followed by /api/v1.
tags:
  - name: Authentication
    description: Accounts, sign-in, sessions and two-factor authentication.
  - name: Users
    description: Your own profile and presence, and looking people up.
  - name: Friends
    description: Friend requests, friends and blocking.
  - name: Conversations
    description: Direct and group chats, and calls in them.
  - name: Communities
    description: Communities, their members, roles, bans and invites.
  - name: Channels
    description: Channels and the messages in them.
  - name: Messages
    description: Editing, deleting and reacting to a message, wherever it is.
  - name: Emoticons
    description: Custom emoticons.
  - name: Media
    description: File uploads.
  - name: Notifications
    description: Sound and notification choices.
  - name: Sync
    description: Catching up on what happened while a client was away.
  - name: Directory
    description: Browsing the public communities and people a server lists.
  - name: Voice
    description: Voice channels and calls (when the server has voice).
  - name: Reports
    description: Reporting a message, a person or a community, and the queue moderators and admins work through.
  - name: Administration
    description: The admin page's API. For admins only, and invisible to everyone else (see the note on each).
security:
  - bearer: []
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Create an account
      description: |
        Makes an account on this server and signs it in. Refused when registration is closed on this server. On an invite-only
        server (the discovery document says `registration.inviteOnly`) an `inviteCode` is required; it is only used up once the
        account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 32, pattern: "^[a-z0-9_]+$", description: "Lowercase letters, digits and underscores." }
                password: { type: string, minLength: 8, maxLength: 256, description: "At least 8 characters with an uppercase letter, a lowercase letter, a number and a symbol." }
                displayName: { type: string, minLength: 1, maxLength: 64 }
                inviteCode: { type: string, maxLength: 64, description: "Needed on an invite-only server; ignored elsewhere." }
      responses:
        "201":
          description: The account, signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedIn" }
        "400":
          description: "`invalid_request` (with `details`), or `password_breached` (the password appears in a known breach)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: "`registration_disabled`, or on an invite-only server `registration_invite_required`, `registration_invite_invalid`, `registration_invite_revoked`, `registration_invite_expired` or `registration_invite_used_up`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`username_taken`: someone has it, or someone did and deleted their account (a name is never given out again)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in
      description: |
        Checks the password. If the account has two-factor sign-in on, the answer is `{ "totpRequired": true, "challengeToken": ... }`
        instead of tokens, and `POST /auth/2fa/login` finishes the sign-in. A suspended account is only told so once its password is
        right, so nobody learns an account is suspended without knowing it. Signing in is also how a request to delete the account is
        taken back: the answer then says `deletionCancelled: true`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in, or the second step is needed.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/SignedIn" }
                  - { $ref: "#/components/schemas/TotpChallenge" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: "`invalid_credentials`: the same answer for an unknown username and a wrong password."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: "`account_suspended`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/2fa/login:
    post:
      tags: [Authentication]
      summary: Finish a two-factor sign-in
      description: Exchanges the challenge from `POST /auth/login` and a code from the authenticator app, or one recovery code (each works once), for tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken]
              properties:
                challengeToken: { type: string }
                code: { type: string, description: "The 6-digit code. One of `code` and `recoveryCode` is required." }
                recoveryCode: { type: string }
      responses:
        "200":
          description: Signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/SignedIn" } } }
        "400":
          description: "`invalid_request`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: "`invalid_challenge_token` (wrong, expired, or not a challenge) or `invalid_code`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: "`account_suspended`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/2fa/setup:
    post:
      tags: [Authentication]
      summary: Start setting up two-factor sign-in
      description: Asks for the password again, then returns the secret to put in an authenticator app. It is not on until `POST /auth/2fa/verify` confirms a code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: The secret to add to an authenticator.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: "The base32 secret." }
                  otpauthUrl: { type: string, description: "An `otpauth://` address for a QR code." }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: "`invalid_credentials` (wrong password) or no valid access token."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`totp_already_enabled`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/2fa/verify:
    post:
      tags: [Authentication]
      summary: Turn two-factor sign-in on
      description: "Confirms a code from the authenticator app. Returns the recovery codes, **once**: they are not kept in a form that can be shown again."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Two-factor sign-in is on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes: { type: array, items: { type: string } }
        "400":
          description: "`invalid_request` or `invalid_code`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/2fa/disable:
    post:
      tags: [Authentication]
      summary: Turn two-factor sign-in off
      description: Asks for the password again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: "Off." }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: "`invalid_credentials`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Get a new access token
      description: Exchanges a refresh token for a new access token and a new refresh token. The one sent is used up, so keep the new one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: A new pair.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: "`invalid_refresh_token`: unknown, used already, revoked or expired."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: "`account_suspended`. The token is left as it is, so unsuspending brings the session back."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: End a session
      description: Revokes the refresh token. Always answers 204, whether or not the token was known.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "204": { description: "Done." }
  /users/me:
    get:
      tags: [Users]
      summary: Your account
      description: Yourself, with the private fields only you are shown (two-factor, findability and contact settings, directory listing).
      responses:
        "200":
          description: You.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/PublicUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Users]
      summary: Change your profile and privacy settings
      description: Any of the fields. `null` clears an optional one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 1, maxLength: 64 }
                bio: { type: [string, "null"], maxLength: 512 }
                avatarUrl: { type: [string, "null"], description: "An uploaded file's `url` (see `POST /media/upload`) or an address." }
                pronouns: { type: [string, "null"], description: "Plain text, up to 32 characters." }
                accentColor: { type: [string, "null"], description: "`#rrggbb`." }
                discoverable: { type: boolean, description: "Whether servers you have nothing to do with may find you." }
                contactPolicy: { type: string, enum: [ANYONE, SHARED_COMMUNITY, LOCAL_ONLY], description: "Who may send you a friend request or start a conversation." }
                listedInDirectory: { type: boolean, description: "Whether the server's directory of people lists you." }
      responses:
        "200":
          description: Your account as it is now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/PublicUser" }
        "400":
          description: "`invalid_request`, `invalid_pronouns` or `invalid_accent_color`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`discoverability_locked` or `directory_listing_locked`: the server has taken that choice away."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /users/me/presence:
    patch:
      tags: [Users]
      summary: Set your status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [ONLINE, AWAY, BUSY, DO_NOT_DISTURB, INVISIBLE, OFFLINE] }
                customStatus: { type: [string, "null"], maxLength: 128 }
      responses:
        "200":
          description: Your account as it is now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/PublicUser" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /users/me/export:
    post:
      tags: [Users]
      summary: Download your data
      description: |
        Everything this server holds about you, as one JSON file: your account, friends, communities, chats, the messages you
        wrote and have not deleted, reactions, emoticons and notification choices. Never other people's messages, a password hash,
        2FA secret, recovery codes or a token. Asks for the password again and is behind the sign-in rate limit. The answer is
        streamed and sent as an attachment (`Content-Disposition`), not cached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: "`attachment; filename=\"chat-export-<username>-<date>.json\"`."
          content:
            application/json:
              schema:
                type: object
                description: "`format` is `federated-chat-export` with a `version`. Sections: `server`, `account`, `friends`, `friendRequests`, `blocked`, `communities`, `conversations`, `messages`, `reactions`, `emoticons`, `notificationSettings`."
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: "`invalid_credentials`, or no valid access token."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /users/me/delete:
    post:
      tags: [Users]
      summary: Ask for your account to be deleted
      description: |
        Starts the deletion of your account. It does not erase anything yet: your sessions end (you are signed out everywhere) and a
        grace period starts (`graceDays`, 14 unless the operator set `ACCOUNT_DELETION_GRACE_DAYS`), during which **signing in again
        cancels it** (the sign-in answer then has `deletionCancelled: true`). When it is over the account is erased: your messages
        (channels, direct messages and groups), friendships, requests, blocks, memberships, saved emoticons, choices, files only you
        used and sessions are removed; other servers are told to forget you; and what is left is an anonymous "Deleted user" row.
        Your username is kept and can never be registered again. Asking again keeps the first date.

        It wants everything that proves it is you and that you mean it: the password, your username typed out, and a code (or one
        recovery code) when you have two-factor sign-in on. It is refused with `owns_communities` while you own a community, with
        the list; transfer each one or delete it first. Behind the sign-in rate limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, username]
              properties:
                password: { type: string }
                username: { type: string, description: "Your own username, as a check that you mean it. Capitals and spaces around it do not matter." }
                code: { type: string, description: "From the authenticator app. Needed when two-factor sign-in is on, unless `recoveryCode` is given." }
                recoveryCode: { type: string }
      responses:
        "202":
          description: Asked for. Nothing is erased yet.
          content:
            application/json:
              schema:
                type: object
                required: [scheduledFor, graceDays]
                properties:
                  scheduledFor: { type: string, format: date-time, description: "When the account is erased unless you sign in first." }
                  graceDays: { type: integer }
        "400":
          description: "`invalid_request`, or `username_mismatch`: the username typed is not yours."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: "`invalid_credentials` (no valid access token, or a wrong password), or `invalid_code` (two-factor sign-in is on and the code is missing or wrong)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`owns_communities`: you own communities, which would be left without an owner. `communities` lists them as `{ id, name }`."
          content:
            application/json:
              schema:
                type: object
                required: [error, communities]
                properties:
                  error: { type: string, const: owns_communities }
                  communities:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string }
                        name: { type: string }
  /admin/me:
    get:
      tags: [Administration]
      summary: Whether you can use the admin page
      description: |
        **For admins only, and invisible to everyone else:** a signed-out visitor, a wrong token, an ordinary account, a suspended or erased
        one, and any account on a server with `ADMIN_ENABLED=false` all get `404 not_found`, exactly what a path that does not exist gives, so
        nobody can tell this API is there. An account is an admin only when the operator's command (`users make-admin`) made it one; nothing
        in the API can.

        Answers without two-factor sign-in so the page can tell the admin what is missing: everything else under `/admin` needs it.
      responses:
        "200":
          description: You are an admin.
          content:
            application/json:
              schema:
                type: object
                required: [admin, twoFactor]
                properties:
                  admin: { type: boolean, const: true }
                  twoFactor: { type: boolean, description: "Whether two-factor sign-in is on. Without it the rest of `/admin` answers 403 `admin_requires_two_factor`." }
        "404": { $ref: "#/components/responses/NotFound" }
      x-hidden-from-others: true
  /reports:
    post:
      tags: [Reports]
      summary: Report a message, a person or a community
      description: |
        Tells the people who can act on it. A **message in a community** goes to that community's moderators (and the server's admins); a
        **direct or group message**, a **person** and a **community** go to the server's admins alone. See `docs/content-reports.md`.

        The answer says only that it was received: nothing you can use to look at it again, and **the person reported is never told** (no
        event, no field on anything they can read). A snapshot of what was reported is kept for `REPORT_RETENTION_DAYS` days.

        You can report only what you can see (anything else is `404`, as if it did not exist), not your own message, person or community
        (`400 cannot_report_self`), and each thing once (`409 already_reported`). At most 10 reports an hour and 30 open at once
        (`429 too_many_reports`). Something in a community **hosted on another server** is `409 remote_community`: report it to that server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRequest" }
      responses:
        "201":
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean, const: true }
        "400":
          description: "`invalid_request`, or `cannot_report_self`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`already_reported`, or `remote_community`: the content lives on another server, whose moderators this server cannot reach."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`too_many_reports`: wait, or let some of yours be closed."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  "/admin/reports":
    get:
      tags: [Reports]
      summary: The server's reports
      description: |
        Every report that reaches this server: what goes to a community's moderators, and what goes to the admins alone (direct and group
        messages, people, communities). A report about you is not shown to you.

        **For admins only, and invisible to everyone else** (see `GET /admin/me`). Needs two-factor sign-in (403 `admin_requires_two_factor`).
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, dismissed] }, description: "Only reports in this state. Without it, all." }
        - { name: scope, in: query, schema: { type: string, enum: [community, server] }, description: "`community`: what goes to a community's moderators. `server`: what goes to the admins alone." }
        - { name: before, in: query, schema: { type: integer, minimum: 1 }, description: "Only reports older than this: the `next` of the page before." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of reports, newest first, and how many are open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportPage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-hidden-from-others: true
  "/admin/reports/{reportId}":
    get:
      tags: [Reports]
      summary: One report
      description: The report, with the snapshot of what was reported. A report about you is a 404, and so is one that is not in this queue.
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string }, description: "The report's id." }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                type: object
                required: [report]
                properties:
                  report: { $ref: "#/components/schemas/Report" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-hidden-from-others: true
  "/admin/reports/{reportId}/resolve":
    post:
      tags: [Reports]
      summary: Close a report as resolved
      description: "Closes an open report, saying what was done. It records that the action was taken (a message deleted, a member removed); it does not take the action, which goes through its own operation and its own permission check. Needs the two-factor sign-in but not sudo mode, because it changes nothing but the report."
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string }, description: "The report's id." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveReport" }
      responses:
        "200":
          description: The report, as it is now.
          content:
            application/json:
              schema:
                type: object
                required: [report]
                properties:
                  report: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_open`: someone already closed it."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
      x-hidden-from-others: true
  "/admin/reports/{reportId}/dismiss":
    post:
      tags: [Reports]
      summary: Close a report as dismissed
      description: "Closes an open report without action, with an optional note. Needs the two-factor sign-in but not sudo mode, because it changes nothing but the report."
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string }, description: "The report's id." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DismissReport" }
      responses:
        "200":
          description: The report, as it is now.
          content:
