                required: [communities, total]
                properties:
                  communities: { type: array, items: { $ref: "#/components/schemas/AdminCommunity" } }
                  total: { type: integer, description: "How many match in all." }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403":
          description: "`admin_requires_two_factor`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }
      x-hidden-from-others: true
  "/admin/communities/{id}":
    get:
      tags: [Administration]
      summary: One community
      description: |
        The list's fields plus how many members are on this server and on others (and which servers), and how many text and voice channels it has.
        A community that is not hosted here is a 404. For admins only, and invisible to everyone else (see `GET /admin/me`). Needs two-factor sign-in (403 `admin_requires_two_factor`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "The community's id." }
      responses:
        "200":
          description: The community.
          content:
            application/json:
              schema:
                type: object
                required: [community]
                properties:
                  community: { $ref: "#/components/schemas/AdminCommunityDetail" }
        "403":
          description: "`admin_requires_two_factor`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }
      x-hidden-from-others: true
  "/admin/communities/{id}/owner":
    put:
      tags: [Administration]
      summary: Hand a community to one of its members
      description: |
        Makes `username` the owner, as the owner can in the app (`PUT /communities/{id}/owner`) but without needing the owner's password: the admin's way
        when the owner cannot or will not, for instance an account that is being closed, which cannot be deleted while it owns one. Nothing else about the old owner
        changes and they stay a member. Everyone in the community is told, other servers are told to refresh their copy, and it is recorded in the audit log as
        the admin's, from the admin page. The new owner has to be a person on this server who is a member and not already the owner, and not suspended.
        Needs **sudo mode**: a token from `POST /admin/sudo`, sent in the `X-Admin-Sudo` header (403 `sudo_required` without a valid one).
        For admins only, and invisible to everyone else (see `GET /admin/me`). Needs two-factor sign-in (403 `admin_requires_two_factor`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, maxLength: 100, description: "In any case; spaces around it are ignored." }
      responses:
        "200":
          description: Done. The community as it is now.
          content:
            application/json:
              schema:
                type: object
                required: [community]
                properties:
                  community: { $ref: "#/components/schemas/AdminCommunityDetail" }
        "400":
          description: "`invalid_request`, `new_owner_must_be_local` or `already_owner`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: "`sudo_required`, or `admin_requires_two_factor`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "`not_found` (no such community), `user_not_found` or `not_a_member`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`not_hosted_here` (a copy of another server's community), `target_suspended` or `ownership_changed` (someone else moved it first)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
      x-hidden-from-others: true
  "/admin/communities/{id}/delete":
    post:
      tags: [Administration]
      summary: Delete a community
      description: |
        Deletes it for good, with its channels, messages, roles, memberships, bans and emoticons, exactly as its owner deleting it would: every member is told,
        other servers drop their copy, its voice rooms are closed and the files nothing else uses are removed. It cannot be undone, so `confirm` has to be the
        community's name (in any case, spaces around it ignored). Recorded in the audit log as the admin's. A copy of another server's community is theirs to
        delete (409 `not_hosted_here`).
        Needs **sudo mode**: a token from `POST /admin/sudo`, sent in the `X-Admin-Sudo` header (403 `sudo_required` without a valid one).
        For admins only, and invisible to everyone else (see `GET /admin/me`). Needs two-factor sign-in (403 `admin_requires_two_factor`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, maxLength: 200, description: "The community's name, typed out." }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean, enum: [true] }
        "400":
          description: "`confirm_mismatch`, or `invalid_request`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: "`sudo_required`, or `admin_requires_two_factor`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_hosted_here`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
      x-hidden-from-others: true
  /admin/overview:
    get:
      tags: [Administration]
      summary: The server at a glance
      description: |
        What this server is, how it is set up and how busy it is: its version, which features and limits are on, how many people and communities it has, who has been
        about lately, what is waiting to be sent to other servers, and the settings in effect. **Counts and switches only**: no message, no direct message, no name of
        a person or community, no address of a server it is told to talk to or not to, and no secret. Every number is for THIS server (its own accounts and the
        communities it hosts). It changes nothing, so it needs no sudo mode.
        For admins only, and invisible to everyone else (see `GET /admin/me`). Needs two-factor sign-in (403 `admin_requires_two_factor`).
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                type: object
                required: [overview]
                properties:
                  overview: { $ref: "#/components/schemas/AdminOverview" }
        "403":
          description: "`admin_requires_two_factor`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }
      x-hidden-from-others: true
