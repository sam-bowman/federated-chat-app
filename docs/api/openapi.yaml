      summary: Messages in a chat
      description: Oldest first within the page. For the next older page pass the id of the oldest message you have as `before`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: before, in: query, required: false, description: "A message id; only messages older than it.", schema: { type: string } }
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Conversations]
      summary: Send a message in a chat
      description: |
        Text, with optional attachments (files already uploaded with `POST /media/upload`) and a reply. Or an **invitation** to a
        community you are in (`invite`, with no text and no attachments): the card's name and server are filled in from this
        server's own records, never taken from the request. Delivered to members on other servers as well.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, minLength: 1, maxLength: 8000, description: "Required unless this is an invitation." }
                replyToId: { type: string }
                attachments: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/AttachmentInput" } }
                invite:
                  type: object
                  required: [communityId]
                  properties:
                    communityId: { type: string, description: "The community to invite them to; you must be in it." }
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`not_a_member` (of the community), `forbidden` (you may not invite), `community_local_only`, or a reason the community's own server gave."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "`not_found` (the chat) or `community_not_found`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invite_not_possible`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "502":
          description: "`federation_unreachable`: another server could not be reached."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
