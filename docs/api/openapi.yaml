              properties:
                type: { type: string, enum: [DM, GROUP] }
                memberUsernames: { type: array, minItems: 1, items: { type: string }, description: "The other members; you are added. At most one fewer than the group size limit." }
                title: { type: string, maxLength: 100, description: "For a group." }
      responses:
        "200":
          description: A direct chat that already existed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: "#/components/schemas/Conversation" }
        "201":
          description: Started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: "#/components/schemas/Conversation" }
        "400":
          description: "`invalid_request` or `dm_requires_exactly_two_members`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`blocked` or `contact_not_allowed`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "`one_or_more_users_not_found`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
