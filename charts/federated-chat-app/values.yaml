# Default values for federated-chat-app.
#
# This chart bundles plain, hand-rolled Postgres/Redis Deployments (same
# images as docker-compose.yml/docker-compose.selfhost.yml at the repo
# root) rather than depending on an external chart like bitnami/postgresql
# - avoids a network-fetched chart dependency, license-term drift, and a
# much larger values surface than this project needs. For a production
# cluster with its own managed Postgres (RDS, Cloud SQL, a Postgres
# operator, ...), set postgresql.enabled: false and externalDatabase.url
# instead - see the comments below.

# -- This homeserver's own domain. Becomes part of every user id
# (@user:domain) and is advertised to other homeservers for federation -
# pick the real domain you're deploying to. Required; cannot change later
# without breaking every existing user id. (Same variable as
# SERVER_DOMAIN in server/.env.example / docker-compose.selfhost.yml.)
domain: ""

# -- Shown in the client UI.
serverName: "My Chat Server"

server:
  image:
    repository: ghcr.io/sam-bowman/federated-chat-app-server
    # -- Defaults to .Chart.AppVersion (this chart's app version - see
    # Chart.yaml) when empty, so a chart install pulls the matching image
    # version automatically.
    tag: ""
    pullPolicy: IfNotPresent

  # -- Multiple replicas need redis.enabled: true (or an external
  # REDIS_URL via extraEnv) - otherwise each replica tracks presence,
  # rate limits, and realtime delivery purely in-memory and independently
  # of the others, which silently breaks cross-replica delivery. The
  # chart refuses to template with replicaCount > 1 and Redis disabled -
  # see templates/_helpers.tpl.
  replicaCount: 1

  # -- Pod-level security context for the server. The default `fsGroup` is what makes the
  # uploads volume writable: the server image runs as a non-root user, and many storage
  # drivers hand out a new volume owned by root with mode 755 (Longhorn does; kind's
  # default provisioner is the exception that hides this), so without a group the server
  # gets EACCES the first time anyone uploads an avatar or attachment. Kubernetes gives the
  # container's process that group and makes the volume group-writable. Any non-zero group
  # id works - it does not have to match the image's user. `OnRootMismatch` skips the
  # recursive ownership change on every restart once the volume is already right. Set
  # to {} to opt out (for example on a storage class that already makes the volume
  # writable, or with storage.driver "s3").
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

  # -- Seconds the server pod waits, once it has been asked to stop, before the server process
  # is told to shut down. The Service and ingress stop sending it traffic asynchronously, and
  # without this delay requests reach a pod that is already exiting: 3 of 79 health polls failed
  # during a rolling restart of 2 replicas (#160). 0 turns the delay off.
  preStopDelaySeconds: 5

  # -- Seconds Kubernetes allows for the whole stop (the delay above, then the server closing its
  # WebSockets and finishing requests, which it caps at about 20 s) before killing the pod.
  # Keep it above preStopDelaySeconds + 20.
  terminationGracePeriodSeconds: 30

  # -- How the Deployment replaces its pod on an upgrade. Empty uses Kubernetes' default
  # (RollingUpdate: the new pod starts before the old one stops). With ONE replica and a
  # ReadWriteOnce uploads volume on a cluster with more than one node, that can hang: the new
  # pod may be scheduled onto a different node and cannot attach a volume the old pod still
  # holds (reasoned, not reproduced). Set `{type: Recreate}` there - it costs a short gap
  # during upgrades, as the bundled Postgres already does for the same reason. Not needed
  # with storage.driver "s3" or a ReadWriteMany uploads volume. With several replicas the
  # chart requires one of those two anyway.
  strategy: {}

  # -- This server's real, externally-reachable origin (e.g.
  # https://api.chat.example.com) - becomes PUBLIC_BASE_URL (what it
  # advertises to other homeservers for federation) and, by default,
  # the client's API_URL below. Required.
  publicUrl: ""

  # -- The client's real, externally-reachable origin - becomes
  # CORS_ORIGIN. Must match exactly what's in a browser's address bar
  # (scheme + host + port, no path, no trailing slash) or every API call
  # will fail CORS. Required.
  clientPublicUrl: ""

  desktopApp:
    # -- Let the desktop app call this server. The app is not served from the client's address: on Windows it runs
    # from http://tauri.localhost, and without that origin in CORS_ORIGIN the app finds the server (discovery is open to
    # every origin) and then every sign-in and message request is blocked. Only the Windows origin is known to be right;
    # macOS and Linux use another web engine and may send a different one, listed in extraCorsOrigins once confirmed.
    # Set false for a server that does not want desktop clients.
    enabled: true

  # -- Further browser origins allowed to call this server, each a bare origin
  # (scheme + host + port, no path), appended to server.clientPublicUrl (and the desktop app's, above) in CORS_ORIGIN.
  extraCorsOrigins: []

  registrationEnabled: true

  # -- Ask for an invite code before an account is made (needs registrationEnabled). Make codes with the command in
  # docs/deployment/invite-only.md (kubectl exec ... node dist/registrationInvitesCli.js create). People who already
  # have an account are not affected. Read at startup.
  registrationInviteOnly: false

  # -- Show a small text card (title, description, site) under a message that links to a web page. The SERVER reads the page,
  # so it makes outbound requests to addresses people type; it refuses private and internal addresses, but turn it on
  # deliberately. See docs/deployment/link-previews.md. Off by default. Read at startup.
  linkPreviews: false

  rateLimit:
    max: 300
    authMax: 10

  federation:
    # -- Whether the server talks to other homeservers at all. false makes it PRIVATE: its discovery document says it is
    # not federating, every /federation/v1 request is refused, it sends nothing, and nobody on it can add, message or
    # join anyone on another server. What already exists with other servers is kept and resumes if this is set back to
    # true. (FEDERATION_ENABLED; see docs/deployment/private-server.md.)
    enabled: true
    # -- Talk ONLY to these servers' domains (FEDERATION_ALLOWED_DOMAINS), e.g. [family.example.com]: every other server is
    # neither answered nor contacted. Empty (the default) means no limit. Exact domains, optionally with :port, no wildcards.
    allowedDomains: []
    # -- Talk to every server EXCEPT these (FEDERATION_BLOCKED_DOMAINS), e.g. [spam.example]. Empty means none are blocked.
    # A domain may not be in both lists. What already exists with a server that is not permitted is kept and waits.
    blockedDomains: []
    # -- Whether the people on this server can be found by other servers (FEDERATION_USER_DISCOVERABILITY): default-on (each person
    # can hide; new accounts are findable), default-off (new accounts start hidden) or forced-off (nobody is findable, and nobody can
    # change it). A server with no relationship to a hidden person is told they do not exist.
    userDiscoverability: default-on

  directory:
    # -- Whether the server publishes a directory (DIRECTORY_ENABLED) of its PUBLIC communities and of the people who chose to be listed,
    # for its own people and, through their servers, others to browse. Off by default.
    enabled: false
    # -- Whether people are listed in it (DIRECTORY_PEOPLE): default-off (each person chooses, starts unlisted), default-on (new
    # accounts start listed) or forced-off (nobody is listed).
    people: default-off

  contactPolicy:
    # -- Who new accounts let send friend requests and start conversations (FEDERATION_CONTACT_POLICY_DEFAULT): ANYONE, SHARED_COMMUNITY or LOCAL_ONLY.
    default: ANYONE
    # -- The widest anyone may be here (FEDERATION_CONTACT_POLICY_LIMIT): a person's own choice can only narrow it. ANYONE is no limit.
    limit: ANYONE

  communityVisibility:
    # -- Where new communities start (COMMUNITY_VISIBILITY_DEFAULT): UNLISTED, INVITE_ONLY, LOCAL_ONLY or PUBLIC. Empty: unlisted, or the limit
    # if that is narrower. May not be wider than the limit.
    default: ""
    # -- The most exposed to other servers any community may be (COMMUNITY_VISIBILITY_LIMIT): PUBLIC (no limit), UNLISTED, INVITE_ONLY or LOCAL_ONLY.
    limit: PUBLIC

  # -- How many reverse proxies / load balancers sit between the internet and the
  # server, becoming TRUST_PROXY. Rate limiting (above) keys on the client address,
  # and behind an ingress controller the server only sees the controller's address
  # unless it is told to trust the X-Forwarded-For the controller sets: left empty,
  # EVERY user shares one rate-limit bucket (10 auth attempts per 15 minutes for the
  # whole server). Set it to 1 for a single ingress controller (Traefik, ingress-nginx,
  # ...) that is the first thing clients reach; use the number of hops - or a
  # comma-separated list of the proxies' addresses/CIDRs - if a cloud load balancer
  # sits in front of it too. There is deliberately no "trust everything" value.
  trustProxy: ""

  service:
    type: ClusterIP
    port: 4000

  ingress:
    enabled: false
    className: ""
    annotations: {}
    # -- The host that reaches the API. Leave empty with `sharedHost: true`.
    host: ""
    # -- Serve the API on the SAME host as the web client (`client.ingress.host`), by path, instead of on a host of its
    # own. This is the recommended layout: the host in a user id (`domain`) is where other servers look the server up
    # (`/.well-known/communication-platform`, `/federation/v1/...`), so it has to reach the server; with one host that
    # is automatically true, and the browser never makes a cross-origin call. Set `server.publicUrl` and
    # `server.clientPublicUrl` to the same address. The client's own Ingress still takes everything else (`/`).
    sharedHost: false
    # -- The paths sent to the server. Empty means `/` (everything, for a host of its own) or, with `sharedHost`, the
    # server's paths: /api, /ws, /uploads, /federation, /.well-known/communication-platform and /healthz.
    paths: []
    # -- An extra host that reaches ONLY the discovery document and `/federation`, for the layout where the client and
    # the API keep separate hosts but the host in the user id (`domain`) is the client's: set it to `domain`.
    federationHost: ""
    tls: []

  # Message/avatar/emoticon attachments (server/src/config.ts's
  # UPLOADS_DIR), only used when storage.driver is "disk" (the default)
  # below. With replicaCount > 1, every replica needs to see the SAME
  # uploads, which a ReadWriteOnce PVC can't provide across nodes - a replica
  # scheduled on another node stays stuck in Init with a Multi-Attach error
  # (reproduced on a real cluster). So the chart refuses that combination:
  # use storage.driver "s3" (the real fix), or set accessMode to
  # ReadWriteMany on a storage class that supports it (Longhorn does, through
  # its share manager). An existing claim's accessMode cannot be edited in
  # place; see docs/deployment/kubernetes.md "Running more than one server
  # replica" for converting an install.
  uploads:
    # -- Opt out of the check above, for a setup that is deliberately safe: for
    # example every replica pinned to one node (nodeSelector/affinity), where a
    # ReadWriteOnce volume is mounted by all of them. Otherwise leave false.
    allowUnsharedWithReplicas: false
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: ""
      accessMode: ReadWriteOnce

  # Where uploaded files are stored - server/src/lib/storage/. "disk" (the
  # default) uses the uploads PVC above, correct for a single replica and
  # identical to how this chart behaved before S3 support existed.
  # Switching to "s3" is the actual fix for the replicaCount > 1 /
  # ReadWriteOnce limitation above: every replica reads/writes the same
  # bucket, so there's no PVC-sharing problem to work around at all.
  storage:
    driver: disk
    s3:
      bucket: ""
      region: ""
      # Required when storage.driver is "s3" (or set storage.s3.existingSecret
      # instead, pointing at a Secret with keys access-key-id/secret-access-key).
      accessKeyId: ""
      secretAccessKey: ""
      existingSecret: ""
      # Required when storage.driver is "s3" - see server/.env.example's
      # S3_PUBLIC_URL_BASE comment for why this can't be derived automatically.
      publicUrlBase: ""
      # Optional - only for a non-AWS S3-compatible endpoint (MinIO, R2,
      # Spaces, ...). Unset talks to real AWS S3.
      endpoint: ""
      forcePathStyle: false

  resources: {}

  # -- Extra env vars appended as-is (e.g. REDIS_URL pointing at an
  # external Redis instead of this chart's bundled one, or
  # MAX_UPLOAD_BYTES) - see server/.env.example for the full list this
  # image reads.
  extraEnv: []

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

client:
  image:
    repository: ghcr.io/sam-bowman/federated-chat-app-client
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 1

  # -- Seconds a client pod waits, once asked to stop, before nginx is told to stop, so the
  # Service and ingress stop routing to it first (the same reason as server.preStopDelaySeconds).
  # 0 turns the delay off.
  preStopDelaySeconds: 5

  # -- Seconds Kubernetes allows for the whole stop before killing the pod; keep it above
  # preStopDelaySeconds plus a few seconds for nginx to finish its requests.
  terminationGracePeriodSeconds: 30

  # -- How the Deployment replaces its pods on an upgrade. Empty uses Kubernetes' default
  # (RollingUpdate, 25% surge, 25% unavailable). With several replicas, for example
  # `{type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}` keeps every
  # replica serving until its replacement is Ready.
  strategy: {}

  # -- Spreads the replicas over nodes or zones, as Kubernetes' own field (a list of
  # constraints; the selector is yours to write, the labels are
  # app.kubernetes.io/component: client and app.kubernetes.io/instance: <release>).
  topologySpreadConstraints: []

  # -- A PodDisruptionBudget for the client pods, so a node drain cannot take them all down at
  # once. Only useful with replicaCount > 1 (with one replica minAvailable: 1 blocks every drain).
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  # -- Fixes this deployment to server.publicUrl above (the common case -
  # your own client pointed at your own server). Set to false instead to
  # get the home-server picker - see README "Logging into a different
  # server" - letting whoever visits the client type in any server's
  # address, including ones this chart doesn't run.
  fixedServerMode: true

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []

  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Keep the Postgres and uploads PersistentVolumeClaims when the release is
# uninstalled (helm.sh/resource-policy: keep), so `helm uninstall` cannot
# delete your data. Reinstalling under the same release name picks the same
# volumes up again - including the Postgres password they were created with,
# so a different postgresql.auth.password then fails with P1000. Delete them
# with `kubectl delete pvc ...` to start clean, or set this to false for
# throwaway installs.
keepVolumesOnUninstall: true

# JWT signing secrets. Required - the chart refuses to template without
# them (or existingSecret below), the same fail-fast philosophy as
# docker-compose.selfhost.yml's ${VAR:?message} vars, rather than
# silently falling back to server/src/config.ts's dev-insecure default.
# Generate with: openssl rand -base64 32 (each one, they must differ).
secrets:
  jwtAccessSecret: ""
  jwtRefreshSecret: ""
  # -- Name of a pre-existing Secret to use instead of the two values
  # above - must have keys `jwt-access-secret` and `jwt-refresh-secret`.
  # Takes priority when set.
  existingSecret: ""

# Bundled Postgres - a plain `postgres:16-alpine` Deployment + PVC (same
# image docker-compose.yml/docker-compose.selfhost.yml use), not an HA
# StatefulSet or an external chart dependency. Fine for a single
# self-hosted instance; for anything needing HA/backups/point-in-time
# recovery, run Postgres outside this chart and use externalDatabase
# below instead.
postgresql:
  enabled: true
  auth:
    username: chat
    database: chat
    # -- Required when postgresql.enabled is true (and existingSecret
    # below isn't set). Generate with: openssl rand -base64 24
    password: ""
    # -- Name of a pre-existing Secret with key `postgres-password`,
    # instead of the plain-text value above.
    existingSecret: ""
  image:
    repository: postgres
    tag: "16-alpine"
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""
  resources: {}

# -- Used instead of the bundled Postgres above when postgresql.enabled
# is false - a full connection string, e.g.
# postgresql://user:pass@host:5432/dbname
externalDatabase:
  url: ""

# Bundled Redis - a plain `redis:7-alpine` Deployment (same image
# docker-compose.yml uses for local dev), no persistence by design: it
# only ever holds ephemeral presence/rate-limit/pub-sub state that's safe
# to lose and rebuild, never a source of truth. Only needed at all with
# server.replicaCount > 1 - see the comment there.
redis:
  enabled: false
  image:
    repository: redis
    tag: "7-alpine"
  resources: {}

# -- Voice channels (#53): a LiveKit server (https://livekit.io) the audio goes through. Off by default: nothing below
# is deployed, and the chat server offers no voice. See docs/deployment/voice.md for what it needs from your network (one UDP port and
# one TCP port forwarded to the cluster, and a host name for the websocket).
voice:
  enabled: false
  image:
    repository: livekit/livekit-server
    tag: v1.13.10
    pullPolicy: IfNotPresent
  # -- The name the chat server and LiveKit know this key by (not secret), and its secret (at least 32 characters:
  # `openssl rand -base64 32`). Or put the secret in your own Secret under the key `api-secret` and name it in existingSecret.
  apiKey: ""
  apiSecret: ""
  existingSecret: ""
  logLevel: info
  # -- The address the apps connect to for signalling, wss://... Defaults to wss://<ingress.host>.
  publicUrl: ""
  ingress:
    # -- The signalling websocket, over HTTPS. A host name of its own (LiveKit expects the root path): voice.chat.example.com.
    enabled: true
    host: ""
    className: ""
    annotations: {}
    tls: []
  media:
    # -- The two ports the audio uses, which the router has to forward to the cluster. The UDP one carries almost everything;
    # the TCP one is for networks that block UDP.
    tcpPort: 7881
    udpPort: 7882
    # -- LoadBalancer opens them on the node on k3s (its built-in load balancer) and on clouds; NodePort for other clusters
    # (forward to the node ports); ClusterIP if something else exposes them.
    serviceType: LoadBalancer
    loadBalancerIP: ""
    # -- For NodePort (or LoadBalancer): fixed node ports, so the router can forward to a port that never changes. Empty: Kubernetes picks.
    nodePorts:
      tcp: ""
      udp: ""
    annotations: {}
    # -- Your public IP address, if LiveKit cannot find it by asking a STUN server (empty: it asks).
    externalIp: ""
  resources: {}

# -- Set instead of enabling the bundled Redis above to point at an
# external one (a managed Redis, or one shared with other apps) -
# overrides the bundled Redis's URL entirely when non-empty.
externalRedisUrl: ""
