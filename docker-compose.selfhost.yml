# Self-hosting: pulls the pre-built server + client images from GHCR and
# wires them up with Postgres (and, optionally, Redis). Distinct from
# docker-compose.yml at the repo root, which is dev-only (Postgres/Redis
# for `npm run dev` - the app itself runs natively there, not in a
# container).
#
# Quick start:
#   cp .env.selfhost.example .env.selfhost
#   # edit .env.selfhost - at minimum set SERVER_DOMAIN, the two JWT
#   # secrets, and the two public URLs (see comments in that file)
#   docker compose -f docker-compose.selfhost.yml --env-file .env.selfhost up -d
#
# Replaces the bare `docker run` commands in docs/deployment/docker.md "Docker images" - same
# two images, wired together instead of run by hand.
#
# The client's API_URL is baked into env-config.js at container start and
# fetched by the BROWSER, not proxied server-side (see client/nginx.conf) -
# it must be a real, externally-reachable address, not the Docker-internal
# "server" hostname, since nothing in this stack puts a reverse proxy in
# front of either service. Put one (nginx, Caddy, Traefik) in front
# yourself for TLS and/or a single public port; that's genuinely out of
# scope here since it depends entirely on your own setup.
name: federated-chat-app-selfhost

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.selfhost}"
      POSTGRES_DB: chat
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed to the host - only `server` needs to reach it, over the
    # compose network. Add a `ports:` mapping yourself if you need external
    # DB access (a backup tool, etc).

  # Optional - only starts with `--profile multi-replica` (see docs/scaling.md
  # "Running multiple replicas"). A single `server` replica never touches
  # Redis, and this service never starts without the profile flag.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["multi-replica"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: "ghcr.io/sam-bowman/federated-chat-app-server:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_DOMAIN: "${SERVER_DOMAIN:?Set SERVER_DOMAIN in .env.selfhost - this becomes part of every user id (@user:domain) and cannot change later without breaking existing ones}"
      SERVER_NAME: "${SERVER_NAME:-My Chat Server}"
      DATABASE_URL: "postgresql://chat:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.selfhost}@postgres:5432/chat"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env.selfhost, e.g. output of: openssl rand -base64 32}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.selfhost, e.g. output of: openssl rand -base64 32 - must differ from JWT_ACCESS_SECRET}"
      REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-true}"
      REGISTRATION_INVITE_ONLY: "${REGISTRATION_INVITE_ONLY:-false}"
      LINK_PREVIEWS_ENABLED: "${LINK_PREVIEWS_ENABLED:-false}"
      ACCOUNT_DELETION_GRACE_DAYS: "${ACCOUNT_DELETION_GRACE_DAYS:-14}"
      ADMIN_ENABLED: "${ADMIN_ENABLED:-true}"
      AUDIT_LOG_RETENTION_DAYS: "${AUDIT_LOG_RETENTION_DAYS:-365}"
      REPORT_RETENTION_DAYS: "${REPORT_RETENTION_DAYS:-180}"
      # CORS_ORIGIN is the list of browser origins allowed to call this server:
      # the client's exact public origin (scheme + host + port, no path, no
      # trailing slash) or every request from the browser will fail CORS, plus
      # any extra ones in CORS_EXTRA_ORIGINS (comma-separated), plus the desktop
      # app's origin (Windows: http://tauri.localhost), which is allowed unless
      # you set DESKTOP_APP_ORIGIN to an empty value in .env.selfhost - see
      # docs/security.md "Rate limiting" for the related trust-proxy caveat if
      # you're behind a reverse proxy.
      CORS_ORIGIN: "${CLIENT_PUBLIC_URL:?Set CLIENT_PUBLIC_URL in .env.selfhost - the client's externally-reachable origin, e.g. https://chat.example.com}${DESKTOP_APP_ORIGIN-,http://tauri.localhost}${CORS_EXTRA_ORIGINS:+,${CORS_EXTRA_ORIGINS}}"
      # This server's own externally-reachable address - other homeservers
      # (and this one's own .well-known document) need it to federate.
      # Still required even if you don't care about federation yet: it's
      # also what the client below points at.
      PUBLIC_BASE_URL: "${SERVER_PUBLIC_URL:?Set SERVER_PUBLIC_URL in .env.selfhost - this server's externally-reachable origin, e.g. https://api.chat.example.com}"
      # Only takes effect with `--profile multi-replica` (the redis service
      # above doesn't start otherwise, so setting this without that profile
      # would just fail to connect). Leave unset for a single replica.
      REDIS_URL: "${REDIS_URL:-}"
      # Set to false for a PRIVATE server that does not federate: nothing is answered to or sent to another
      # server, and nobody here can add, message or join anyone on one. See docs/deployment/private-server.md.
      FEDERATION_ENABLED: "${FEDERATION_ENABLED:-true}"
      # Optional limits on WHICH servers this one talks to, comma-separated exact domains (see docs/deployment/private-server.md):
      # ALLOWED = only these; BLOCKED = everyone except these. Both empty (the default) = every server.
      FEDERATION_ALLOWED_DOMAINS: "${FEDERATION_ALLOWED_DOMAINS:-}"
      FEDERATION_BLOCKED_DOMAINS: "${FEDERATION_BLOCKED_DOMAINS:-}"
      # Whether your people can be found by other servers: default-on, default-off or forced-off (see docs/deployment/private-server.md).
      FEDERATION_USER_DISCOVERABILITY: "${FEDERATION_USER_DISCOVERABILITY:-default-on}"
      # Publish a directory of public communities and of the people who chose to be listed (off by default; see docs/deployment/private-server.md).
      DIRECTORY_ENABLED: "${DIRECTORY_ENABLED:-false}"
      # Defaults and limits for what people and communities choose (see docs/deployment/private-server.md). Empty means the usual.
      FEDERATION_CONTACT_POLICY_DEFAULT: "${FEDERATION_CONTACT_POLICY_DEFAULT:-ANYONE}"
      FEDERATION_CONTACT_POLICY_LIMIT: "${FEDERATION_CONTACT_POLICY_LIMIT:-ANYONE}"
      COMMUNITY_VISIBILITY_DEFAULT: "${COMMUNITY_VISIBILITY_DEFAULT:-}"
      COMMUNITY_VISIBILITY_LIMIT: "${COMMUNITY_VISIBILITY_LIMIT:-PUBLIC}"
      DIRECTORY_PEOPLE: "${DIRECTORY_PEOPLE:-default-off}"
      # How many reverse proxies sit in front of the server (e.g. 1 for the nginx/
      # Caddy/Traefik in front of both services, as docs/deployment/docker.md
      # recommends). Unset, every user behind the proxy shares ONE rate-limit
      # bucket. Leave unset if clients reach the server directly.
      TRUST_PROXY: "${TRUST_PROXY:-}"
      # Voice channels (see docs/deployment/voice.md): where the apps connect to LiveKit (wss://...), and the key this server and
      # LiveKit share. All three set = voice is on, none = off. LIVEKIT_INTERNAL_URL is where THIS server asks LiveKit who is in
      # a room: set it to http://livekit:7880 with the bundled `voice` service below (empty: the public address is used).
      LIVEKIT_URL: "${LIVEKIT_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      LIVEKIT_INTERNAL_URL: "${LIVEKIT_INTERNAL_URL:-}"
    ports:
      - "${SERVER_PORT:-4000}:4000"
    volumes:
      - uploads-data:/app/uploads
    # Additional optional server settings (MAX_UPLOAD_BYTES,
    # RATE_LIMIT_MAX, AUTH_RATE_LIMIT_MAX, STORAGE_DRIVER + S3_* for
    # S3-compatible object storage instead of the uploads-data volume
    # below, ...) all work the same way - see server/.env.example for the
    # full list and defaults; add them under `environment:` above exactly
    # as shown there.

  # Optional - only starts with `--profile voice`: the LiveKit server voice channels' audio goes through (see
  # docs/deployment/voice.md). Needs LIVEKIT_API_KEY and LIVEKIT_API_SECRET in .env.selfhost (the secret at least 32 characters:
  # `openssl rand -base64 32`), and these ports reachable from outside: 7880 (the websocket: put your reverse proxy in front for
  # TLS, at the host in LIVEKIT_URL), 7881/tcp and 7882/udp (the audio: forward them from your router, no proxy).
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    profiles: ["voice"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        webhook:
          api_key: "${LIVEKIT_API_KEY:-}"
          urls:
            - http://server:4000/api/v1/voice/webhook
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "7881:7881"
      - "7882:7882/udp"

  client:
    image: "ghcr.io/sam-bowman/federated-chat-app-client:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    environment:
      # Fixes this deployment to the one server above (the common case -
      # your own client pointed at your own server). To get the
      # home-server picker instead - see README "Logging into a different
      # server" - letting whoever visits CLIENT_PUBLIC_URL type in any
      # server's address, including ones you don't run, change this line
      # to `API_URL: ""` rather than setting it from an env var, since
      # SERVER_PUBLIC_URL above is required regardless (the server still
      # needs it for its own federation .well-known document).
      API_URL: "${SERVER_PUBLIC_URL}"
    ports:
      - "${CLIENT_PORT:-8080}:8080"

volumes:
  postgres-data:
  uploads-data:
