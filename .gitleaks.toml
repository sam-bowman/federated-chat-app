title = "gitleaks config"

[extend]
useDefault = true

# Known-fake credentials used as test fixtures - not real secrets. Gitleaks'
# generic-api-key rule (a high-entropy heuristic, not a specific provider
# pattern) flags these purely because the password-complexity policy
# (server/src/modules/auth/routes.ts's passwordSchema) requires a character
# mix that happens to look "secret-shaped". See server/test/helpers/factory.ts.
[allowlist]
description = "Test-only fixture values, never real credentials"
regexes = [
  '''Correct-Horse-Battery-Staple-1''',
  # Made-up LiveKit secrets from the first version of the voice tests (they now make theirs at run time, but the scanner reads
  # every commit of a pull request, including the one they were literals in).
  '''test-secret-that-is-long-enough-for-hs256''',
  '''api-secret-that-is-long-enough-for-hs256''',
  # The LiveKit keys of the development compose file and of the end-to-end suite's LiveKit: made up, for a server that only
  # ever runs on the developer's own machine or a CI runner.
  '''devsecretdevsecretdevsecretdevsecret''',
  '''e2e-livekit-secret-0123456789abcdef''',
  # The same, made up, in the first version of the chart's CI check for voice (it now makes its own at run time).
  '''0123456789abcdef0123456789abcdef''',
]
