name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to a pull request supersedes the older run. Never cancel a run on master: a cancelled
# CodeQL analysis leaves that commit without the baseline later pull requests are compared with.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

# Nothing here writes to the repository. A job that needs more asks for it itself (the pull-request comment of the dependency review,
# the security events of CodeQL).
permissions:
  contents: read

jobs:
  # --- What to run -------------------------------------------------------
  #
  # Not every change needs every check, and the slowest ones (the test suites) are the ones worth
  # skipping. This job decides, from the event and the files a pull request changes, how much of CI to
  # run (the rules, and why, are in .github/scripts/ci-tier.mjs):
  #
  #   full  - code or configuration changed: everything.
  #   light - a release-please version-bump PR: the static checks and the build, not the test suites.
  #   docs  - only documentation changed: just the security scans.
  #   push  - a push to master: just CodeQL; the commit has the content of a pull request that already
  #           passed everything.
  #
  # Skipped jobs are skipped with `if:` rather than by a `paths:` filter on the workflow, on purpose: the
  # branch ruleset requires these checks, and a workflow skipped by `paths:` leaves them "pending" forever,
  # which blocks the merge, whereas a job skipped by `if:` reports as skipped and counts as passing.
  # CodeQL always runs on a pull request, because the ruleset also requires its result.
  #
  # If this job fails for any reason, every `if:` below treats that as "run everything".
  changes:
    name: Decide what to run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: tier
        run: node .github/scripts/ci-tier.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}

  # --- Static checks ---------------------------------------------------

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || contains(fromJSON('["full", "light"]'), needs.changes.outputs.tier)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace client
      # The CI tier classifier (.github/scripts/ci-tier.mjs) decides what gets skipped, so its tests are
      # part of the checks every code change goes through.
      # The ZAP scripts (dast.yml) decide when a dynamic scan fails and which ids it is given, and the security-headers scripts decide what
      # the client's nginx sends (#281); their tests run here too.
      - run: node --test .github/scripts/ci-tier.test.mjs .github/scripts/zap-report.test.mjs .github/scripts/check-client-headers.test.mjs client/scripts/security-headers.test.mjs scripts/check-node.test.mjs

  typecheck-and-build:
    name: Typecheck & build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || contains(fromJSON('["full", "light"]'), needs.changes.outputs.tier)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema server/prisma/schema.prisma
      # Each workspace's build script is `tsc ... && ...` (client also runs
      # `vite build`) - a type error or build failure in either fails this
      # job, and it exercises the exact scripts a deploy would run.
      - run: npm run build --workspace server
      - run: npm run build --workspace client
      # The server's build tsconfig only covers src/ (so test helpers don't
      # ship in the production build) - this separately typechecks test/ too,
      # since vitest itself only transpiles tests and never type-checks them.
      - run: npm run typecheck --workspace server
      - run: npm run typecheck --workspace e2e

  helm-lint:
    name: Helm chart lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || contains(fromJSON('["full", "light"]'), needs.changes.outputs.tier)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - run: helm lint charts/federated-chat-app
      # `helm lint` alone doesn't catch every templating error (e.g. a bad
      # named-template reference only surfaces when a value that reaches
      # it is actually set) - `helm template` with real required values
      # filled in renders every template for real, the same check done
      # manually against a kind cluster before this chart was added.
      - run: |
          helm template ci-test charts/federated-chat-app \
            --set domain=chat.example.com \
            --set server.publicUrl=https://api.chat.example.com \
            --set server.clientPublicUrl=https://chat.example.com \
            --set secrets.jwtAccessSecret=ci-test-access-secret \
            --set secrets.jwtRefreshSecret=ci-test-refresh-secret \
            --set postgresql.auth.password=ci-test-postgres-password \
            > /dev/null
      # Also check the external-database and multi-replica branches, which
      # the default-values render above doesn't exercise.
      - run: |
          helm template ci-test charts/federated-chat-app \
            --set domain=chat.example.com \
            --set server.publicUrl=https://api.chat.example.com \
            --set server.clientPublicUrl=https://chat.example.com \
            --set secrets.jwtAccessSecret=ci-test-access-secret \
            --set secrets.jwtRefreshSecret=ci-test-refresh-secret \
            --set postgresql.enabled=false \
            --set externalDatabase.url=postgresql://u:p@ext-host:5432/db \
            --set server.replicaCount=2 \
            --set redis.enabled=true \
            --set server.storage.driver=s3 \
            --set server.storage.s3.bucket=my-bucket \
            --set server.storage.s3.region=us-east-1 \
            --set server.storage.s3.accessKeyId=AKIA \
            --set server.storage.s3.secretAccessKey=secret \
            --set server.storage.s3.publicUrlBase=https://my-bucket.s3.amazonaws.com \
            > /dev/null
      # The values documented for running behind a Traefik ingress
      # (docs/deployment/kubernetes.md "Ingress with Traefik"): both Ingress
      # objects on the traefik class with TLS, and TRUST_PROXY reaching the server.
      # Checks the rendered output rather than just that it renders - a regression
      # here would silently put every user in one shared rate-limit bucket.
      - run: |
          helm template ci-test charts/federated-chat-app \
            --set domain=chat.example.com \
            --set server.publicUrl=https://api.chat.example.com \
            --set server.clientPublicUrl=https://chat.example.com \
            --set server.trustProxy=1 \
            --set server.ingress.enabled=true \
            --set server.ingress.className=traefik \
            --set server.ingress.host=api.chat.example.com \
            --set 'server.ingress.annotations.traefik\.ingress\.kubernetes\.io/router\.entrypoints=websecure' \
            --set 'server.ingress.tls[0].secretName=chat-tls' \
            --set 'server.ingress.tls[0].hosts[0]=api.chat.example.com' \
            --set client.ingress.enabled=true \
            --set client.ingress.className=traefik \
            --set client.ingress.host=chat.example.com \
            --set 'client.ingress.tls[0].secretName=chat-tls' \
            --set 'client.ingress.tls[0].hosts[0]=chat.example.com' \
            --set secrets.jwtAccessSecret=ci-test-access-secret \
            --set secrets.jwtRefreshSecret=ci-test-refresh-secret \
            --set postgresql.auth.password=ci-test-postgres-password \
            > traefik-render.yaml
          grep -q 'ingressClassName: traefik' traefik-render.yaml
          grep -q 'traefik.ingress.kubernetes.io/router.entrypoints: websecure' traefik-render.yaml
          grep -q 'secretName: chat-tls' traefik-render.yaml
          grep -A1 'name: TRUST_PROXY' traefik-render.yaml | grep -q 'value: "1"'
      # The server image runs as a non-root user and many storage drivers (Longhorn
      # included) hand out a root-owned 755 volume, so the chart sets an fsGroup by
      # default to keep the uploads volume writable - see docs/deployment/kubernetes.md
      # "Storage, and Longhorn". Check the default, the opt-out, and the strategy knob.
      - run: |
          REQUIRED="--set domain=chat.example.com --set server.publicUrl=https://api.chat.example.com --set server.clientPublicUrl=https://chat.example.com --set secrets.jwtAccessSecret=a --set secrets.jwtRefreshSecret=b --set postgresql.auth.password=p"
          helm template ci-test charts/federated-chat-app $REQUIRED > default-render.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED --set server.podSecurityContext=null > no-fsgroup-render.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED --set server.strategy.type=Recreate > recreate-render.yaml
          grep -q 'fsGroup: 1000' default-render.yaml
          grep -q 'fsGroupChangePolicy: OnRootMismatch' default-render.yaml
          ! grep -q 'fsGroup' no-fsgroup-render.yaml
          test "$(grep -c 'type: Recreate' recreate-render.yaml)" = 2
      # Several replicas with disk uploads must have a volume every replica can mount: a
      # ReadWriteOnce claim left a second replica stuck in Init (Multi-Attach) on a real
      # cluster, with helm reporting success. The chart now refuses it (templates/_helpers.tpl).
      - run: |
          MULTI="--set domain=chat.example.com --set server.publicUrl=https://api.chat.example.com --set server.clientPublicUrl=https://chat.example.com --set secrets.jwtAccessSecret=a --set secrets.jwtRefreshSecret=b --set postgresql.auth.password=p --set server.replicaCount=2 --set redis.enabled=true"
          if helm template ci-test charts/federated-chat-app $MULTI > rwo-out.txt 2>&1; then
            echo "expected 2 replicas + ReadWriteOnce disk uploads to be refused"; exit 1
          fi
          grep -q 'Multi-Attach' rwo-out.txt
          grep -q 'ReadWriteMany' rwo-out.txt
          if helm template ci-test charts/federated-chat-app $MULTI --set server.uploads.persistence.enabled=false > nopvc-out.txt 2>&1; then
            echo "expected 2 replicas + disk uploads without a volume to be refused"; exit 1
          fi
          grep -q 'private, temporary uploads' nopvc-out.txt
          helm template ci-test charts/federated-chat-app $MULTI --set server.uploads.persistence.accessMode=ReadWriteMany > rwx-render.yaml
          grep -q '    - ReadWriteMany' rwx-render.yaml
          helm template ci-test charts/federated-chat-app $MULTI --set server.uploads.allowUnsharedWithReplicas=true > /dev/null
      # A stopping server pod waits before shutting down so the ingress stops sending it
      # requests first (#160); the delay is configurable and can be turned off.
      - run: |
          REQUIRED="--set domain=chat.example.com --set server.publicUrl=https://api.chat.example.com --set server.clientPublicUrl=https://chat.example.com --set secrets.jwtAccessSecret=a --set secrets.jwtRefreshSecret=b --set postgresql.auth.password=p"
          helm template ci-test charts/federated-chat-app $REQUIRED > prestop-default.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED --set server.preStopDelaySeconds=0 > prestop-off.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED --set server.preStopDelaySeconds=9 --set server.terminationGracePeriodSeconds=45 > prestop-custom.yaml
          grep -qF 'command: ["sleep", "5"]' prestop-default.yaml
          grep -q 'terminationGracePeriodSeconds: 30' prestop-default.yaml
          ! grep -q 'preStop' prestop-off.yaml
          grep -qF 'command: ["sleep", "9"]' prestop-custom.yaml
          grep -q 'terminationGracePeriodSeconds: 45' prestop-custom.yaml
      # Voice channels: nothing of it is rendered by default (the chart is exactly what it was); with voice.enabled it adds LiveKit and
      # tells the server where it is; and what is missing or wrong is refused at install time, not as a crash loop.
      - run: |
          REQUIRED="--set domain=chat.example.com --set server.publicUrl=https://api.chat.example.com --set server.clientPublicUrl=https://chat.example.com --set secrets.jwtAccessSecret=a --set secrets.jwtRefreshSecret=b --set postgresql.auth.password=p"
          VOICE="--set voice.enabled=true --set voice.apiKey=chat --set voice.apiSecret=$(openssl rand -hex 16) --set voice.ingress.host=voice.chat.example.com"
          helm template ci-test charts/federated-chat-app $REQUIRED > voice-off.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED $VOICE > voice-on.yaml
          if grep -qi 'livekit' voice-off.yaml; then echo "voice is rendered by default"; exit 1; fi
          grep -A1 'name: LIVEKIT_URL' voice-on.yaml | grep -qF 'value: "wss://voice.chat.example.com"'
          grep -qF 'name: ci-test-federated-chat-app-livekit-media' voice-on.yaml
          grep -qF 'protocol: UDP' voice-on.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED $VOICE --set voice.media.serviceType=NodePort --set-string voice.media.nodePorts.udp=30882 | grep -qF 'nodePort: 30882'
          if helm template ci-test charts/federated-chat-app $REQUIRED --set voice.enabled=true --set voice.apiKey=chat --set voice.ingress.host=v.example.com 2> voice-missing.err; then echo "voice without a secret was accepted"; exit 1; fi
          grep -q 'voice.apiSecret is required' voice-missing.err
          if helm template ci-test charts/federated-chat-app $REQUIRED --set voice.enabled=true --set voice.apiKey=chat --set voice.apiSecret=short --set voice.ingress.host=v.example.com 2> voice-short.err; then echo "a short voice secret was accepted"; exit 1; fi
          grep -q 'shorter than 32' voice-short.err
      # Invite-only registration: server.registrationInviteOnly reaches the server as REGISTRATION_INVITE_ONLY, false by default.
      - run: |
          REQUIRED="--set domain=chat.example.com --set server.publicUrl=https://api.chat.example.com --set server.clientPublicUrl=https://chat.example.com --set secrets.jwtAccessSecret=a --set secrets.jwtRefreshSecret=b --set postgresql.auth.password=p"
          helm template ci-test charts/federated-chat-app $REQUIRED > invite-default.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED --set server.registrationInviteOnly=true > invite-on.yaml
          grep -A1 'name: REGISTRATION_INVITE_ONLY' invite-default.yaml | grep -qF 'value: "false"'
          grep -A1 'name: REGISTRATION_INVITE_ONLY' invite-on.yaml | grep -qF 'value: "true"'
      # Link previews (#197): server.linkPreviews reaches the server as LINK_PREVIEWS_ENABLED, false by default.
      - run: |
          REQUIRED="--set domain=chat.example.com --set server.publicUrl=https://api.chat.example.com --set server.clientPublicUrl=https://chat.example.com --set secrets.jwtAccessSecret=a --set secrets.jwtRefreshSecret=b --set postgresql.auth.password=p"
          helm template ci-test charts/federated-chat-app $REQUIRED > previews-default.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED --set server.linkPreviews=true > previews-on.yaml
          grep -A1 'name: LINK_PREVIEWS_ENABLED' previews-default.yaml | grep -qF 'value: "false"'
          grep -A1 'name: LINK_PREVIEWS_ENABLED' previews-on.yaml | grep -qF 'value: "true"'
      # Name lookups (#236): the server pod asks for ndots 1 by default (a search domain whose DNS answers "no data" for names that do not exist
      # breaks the Alpine resolver for every outside name), it can be switched off, and a dnsPolicy / dnsConfig of the operator's own is passed on.
      - run: |
          REQUIRED="--set domain=chat.example.com --set server.publicUrl=https://api.chat.example.com --set server.clientPublicUrl=https://chat.example.com --set secrets.jwtAccessSecret=a --set secrets.jwtRefreshSecret=b --set postgresql.auth.password=p"
          helm template ci-test charts/federated-chat-app $REQUIRED > dns-default.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED --set server.dnsConfig=null > dns-off.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED --set server.dnsPolicy=None --set 'server.dnsConfig.nameservers[0]=10.0.0.1' --set server.dnsConfig.options=null > dns-custom.yaml
          grep -A3 'dnsConfig:' dns-default.yaml | grep -qF 'name: ndots'
          grep -A4 'dnsConfig:' dns-default.yaml | grep -qF 'value: "1"'
          if grep -q 'dnsPolicy' dns-default.yaml; then echo "dnsPolicy is set by default"; exit 1; fi
          if grep -q 'dnsConfig' dns-off.yaml; then echo "dnsConfig is rendered although it was switched off"; exit 1; fi
          grep -qF 'dnsPolicy: None' dns-custom.yaml
          grep -A2 'dnsConfig:' dns-custom.yaml | grep -qF '10.0.0.1'
          if grep -q 'ndots' dns-custom.yaml; then echo "the default option is still there"; exit 1; fi
      # Account deletion (#60): server.accountDeletion.graceDays reaches the server as ACCOUNT_DELETION_GRACE_DAYS, 14 by default.
      - run: |
          REQUIRED="--set domain=chat.example.com --set server.publicUrl=https://api.chat.example.com --set server.clientPublicUrl=https://chat.example.com --set secrets.jwtAccessSecret=a --set secrets.jwtRefreshSecret=b --set postgresql.auth.password=p"
          helm template ci-test charts/federated-chat-app $REQUIRED > deletion-default.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED --set server.accountDeletion.graceDays=3 > deletion-on.yaml
          grep -A1 'name: ACCOUNT_DELETION_GRACE_DAYS' deletion-default.yaml | grep -qF 'value: "14"'
          grep -A1 'name: ACCOUNT_DELETION_GRACE_DAYS' deletion-on.yaml | grep -qF 'value: "3"'
      # The admin page (#206) and the audit log (#59): server.admin.enabled -> ADMIN_ENABLED (on by default), server.auditLog.retentionDays -> AUDIT_LOG_RETENTION_DAYS (365).
      - run: |
          REQUIRED="--set domain=chat.example.com --set server.publicUrl=https://api.chat.example.com --set server.clientPublicUrl=https://chat.example.com --set secrets.jwtAccessSecret=a --set secrets.jwtRefreshSecret=b --set postgresql.auth.password=p"
          helm template ci-test charts/federated-chat-app $REQUIRED > admin-default.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED --set server.admin.enabled=false --set server.auditLog.retentionDays=30 > admin-off.yaml
          grep -A1 'name: ADMIN_ENABLED' admin-default.yaml | grep -qF 'value: "true"'
          grep -A1 'name: AUDIT_LOG_RETENTION_DAYS' admin-default.yaml | grep -qF 'value: "365"'
          grep -A1 'name: ADMIN_ENABLED' admin-off.yaml | grep -qF 'value: "false"'
          grep -A1 'name: AUDIT_LOG_RETENTION_DAYS' admin-off.yaml | grep -qF 'value: "30"'
      # Content reports (#58): server.reports.retentionDays -> REPORT_RETENTION_DAYS (180).
      - run: |
          REQUIRED="--set domain=chat.example.com --set server.publicUrl=https://api.chat.example.com --set server.clientPublicUrl=https://chat.example.com --set secrets.jwtAccessSecret=a --set secrets.jwtRefreshSecret=b --set postgresql.auth.password=p"
          helm template ci-test charts/federated-chat-app $REQUIRED > reports-default.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED --set server.reports.retentionDays=30 > reports-on.yaml
          grep -A1 'name: REPORT_RETENTION_DAYS' reports-default.yaml | grep -qF 'value: "180"'
          grep -A1 'name: REPORT_RETENTION_DAYS' reports-on.yaml | grep -qF 'value: "30"'
      # A private server (#109): server.federation.enabled reaches the server as FEDERATION_ENABLED, true by default.
      - run: |
          REQUIRED="--set domain=chat.example.com --set server.publicUrl=https://api.chat.example.com --set server.clientPublicUrl=https://chat.example.com --set secrets.jwtAccessSecret=a --set secrets.jwtRefreshSecret=b --set postgresql.auth.password=p"
          helm template ci-test charts/federated-chat-app $REQUIRED > federation-default.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED --set server.federation.enabled=false > federation-off.yaml
          grep -A1 'name: FEDERATION_ENABLED' federation-default.yaml | grep -qF 'value: "true"'
          grep -A1 'name: FEDERATION_ENABLED' federation-off.yaml | grep -qF 'value: "false"'
          # Which servers it talks to (#109 phase 2): neither variable by default; the lists are joined with commas; a domain in
          # both is refused at install time rather than as a crash loop.
          if grep -q 'FEDERATION_ALLOWED_DOMAINS\|FEDERATION_BLOCKED_DOMAINS' federation-default.yaml; then echo "the lists are set by default"; exit 1; fi
          helm template ci-test charts/federated-chat-app $REQUIRED --set 'server.federation.allowedDomains={a.example,b.example}' --set 'server.federation.blockedDomains={c.example}' > federation-lists.yaml
          grep -A1 'name: FEDERATION_ALLOWED_DOMAINS' federation-lists.yaml | grep -qF 'value: "a.example,b.example"'
          grep -A1 'name: FEDERATION_BLOCKED_DOMAINS' federation-lists.yaml | grep -qF 'value: "c.example"'
          if helm template ci-test charts/federated-chat-app $REQUIRED --set 'server.federation.allowedDomains={a.example}' --set 'server.federation.blockedDomains={A.example}' 2> both.err; then echo "a domain in both lists was accepted"; exit 1; fi
          grep -q 'both list' both.err
          # Whether people can be found (#109 phase 3): default-on unless set, passed through, and a value that is not one of the
          # three is refused at install time.
          grep -A1 'name: FEDERATION_USER_DISCOVERABILITY' federation-default.yaml | grep -qF 'value: "default-on"'
          helm template ci-test charts/federated-chat-app $REQUIRED --set server.federation.userDiscoverability=forced-off > federation-forced.yaml
          grep -A1 'name: FEDERATION_USER_DISCOVERABILITY' federation-forced.yaml | grep -qF 'value: "forced-off"'
          if helm template ci-test charts/federated-chat-app $REQUIRED --set server.federation.userDiscoverability=hidden 2> disc.err; then echo "an unknown discoverability value was accepted"; exit 1; fi
          grep -q 'default-on, default-off or forced-off' disc.err
          # The directory (#109 phase 5): off unless asked for, and passed through when it is.
          grep -A1 'name: DIRECTORY_ENABLED' federation-default.yaml | grep -qF 'value: "false"'
          helm template ci-test charts/federated-chat-app $REQUIRED --set server.directory.enabled=true > directory-on.yaml
          grep -A1 'name: DIRECTORY_ENABLED' directory-on.yaml | grep -qF 'value: "true"'
          # Defaults and limits (#189): the usual unless set, passed through when set, and a value that is not a name is refused at install time.
          grep -A1 'name: FEDERATION_CONTACT_POLICY_LIMIT' federation-default.yaml | grep -qF 'value: "ANYONE"'
          grep -A1 'name: COMMUNITY_VISIBILITY_LIMIT' federation-default.yaml | grep -qF 'value: "PUBLIC"'
          grep -A1 'name: DIRECTORY_PEOPLE' federation-default.yaml | grep -qF 'value: "default-off"'
          if grep -q 'COMMUNITY_VISIBILITY_DEFAULT' federation-default.yaml; then echo "a community default is set when none was asked for"; exit 1; fi
          helm template ci-test charts/federated-chat-app $REQUIRED --set server.contactPolicy.limit=LOCAL_ONLY --set server.communityVisibility.default=INVITE_ONLY --set server.communityVisibility.limit=INVITE_ONLY --set server.directory.people=forced-off > defaults-set.yaml
          grep -A1 'name: FEDERATION_CONTACT_POLICY_LIMIT' defaults-set.yaml | grep -qF 'value: "LOCAL_ONLY"'
          grep -A1 'name: COMMUNITY_VISIBILITY_DEFAULT' defaults-set.yaml | grep -qF 'value: "INVITE_ONLY"'
          grep -A1 'name: DIRECTORY_PEOPLE' defaults-set.yaml | grep -qF 'value: "forced-off"'
          for bad in server.contactPolicy.limit=nobody server.communityVisibility.limit=private server.directory.people=maybe; do
            if helm template ci-test charts/federated-chat-app $REQUIRED --set "$bad" 2> bad.err; then echo "$bad was accepted"; exit 1; fi
            grep -q 'use ' bad.err
          done
      # Several web client replicas (#152): the same preStop delay as the server, a PodDisruptionBudget
      # that is off by default, and passthroughs for the update strategy and topology spread.
      - run: |
          REQUIRED="--set domain=chat.example.com --set server.publicUrl=https://api.chat.example.com --set server.clientPublicUrl=https://chat.example.com --set secrets.jwtAccessSecret=a --set secrets.jwtRefreshSecret=b --set postgresql.auth.password=p"
          helm template ci-test charts/federated-chat-app $REQUIRED > client-default.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED --set client.replicaCount=3 --set client.podDisruptionBudget.enabled=true --set client.podDisruptionBudget.minAvailable=2 --set client.strategy.type=RollingUpdate --set client.strategy.rollingUpdate.maxUnavailable=0 --set 'client.topologySpreadConstraints[0].maxSkew=1' --set 'client.topologySpreadConstraints[0].topologyKey=kubernetes.io/hostname' --set 'client.topologySpreadConstraints[0].whenUnsatisfiable=ScheduleAnyway' --set 'client.topologySpreadConstraints[0].labelSelector.matchLabels.app.kubernetes.io/component=client' > client-many.yaml
          helm template ci-test charts/federated-chat-app $REQUIRED --set client.preStopDelaySeconds=0 > client-no-prestop.yaml
          test "$(grep -c 'kind: PodDisruptionBudget' client-default.yaml)" = 0
          test "$(grep -c 'sleep", "5"' client-default.yaml)" = 2
          test "$(grep -c 'sleep", "5"' client-no-prestop.yaml)" = 1
          grep -q 'kind: PodDisruptionBudget' client-many.yaml
          grep -q 'minAvailable: 2' client-many.yaml
          grep -q 'maxUnavailable: 0' client-many.yaml
          grep -q 'topologySpreadConstraints:' client-many.yaml
      # Where the host in a user id points (#195): other servers look a person up at https://<domain>/.well-known/... and
      # send federation traffic to https://<domain>/federation/v1, so that host has to reach the server. The API on the
      # client's own host (sharedHost), a separate API host plus federationHost, and the default two hosts (which the chart says
      # cannot be found) are each rendered and the paths checked. Also the desktop app's origin (allowed unless switched off).
      - run: |
          BASE="--set domain=chat.example.com --set secrets.jwtAccessSecret=a --set secrets.jwtRefreshSecret=b --set postgresql.auth.password=p --set server.ingress.enabled=true --set client.ingress.enabled=true --set client.ingress.host=chat.example.com"
          SPLIT="$BASE --set server.publicUrl=https://api.chat.example.com --set server.clientPublicUrl=https://chat.example.com --set server.ingress.host=api.chat.example.com"
          ONE="$BASE --set server.publicUrl=https://chat.example.com --set server.clientPublicUrl=https://chat.example.com --set server.ingress.sharedHost=true"
          # Two hosts, as before: the whole API host goes to the server, and the user-id host does not reach it.
          helm template ci-test charts/federated-chat-app $SPLIT -s templates/server-ingress.yaml > ingress-split.yaml
          grep -qF 'host: "api.chat.example.com"' ingress-split.yaml
          test "$(grep -c 'path:' ingress-split.yaml)" = 1
          grep -qE 'path: /$' ingress-split.yaml
          grep -qF 'identity-host-reaches-server: "false"' ingress-split.yaml
          # One host: the server's paths on the client's host, not "/", and the user-id host reaches the server.
          helm template ci-test charts/federated-chat-app $ONE -s templates/server-ingress.yaml > ingress-one.yaml
          grep -qF 'host: "chat.example.com"' ingress-one.yaml
          for p in /api /ws /uploads /federation /.well-known/communication-platform /healthz; do grep -qE "path: $p\$" ingress-one.yaml; done
          if grep -qE 'path: /$' ingress-one.yaml; then echo "the server was given the client's whole host"; exit 1; fi
          grep -qF 'identity-host-reaches-server: "true"' ingress-one.yaml
          # The client still takes everything else.
          helm template ci-test charts/federated-chat-app $ONE -s templates/client-ingress.yaml | grep -qE 'path: /$'
          # Separate API host plus federationHost: only the two paths on the user-id host.
          helm template ci-test charts/federated-chat-app $SPLIT --set server.ingress.federationHost=chat.example.com -s templates/server-ingress.yaml > ingress-fed.yaml
          grep -qF 'host: "chat.example.com"' ingress-fed.yaml
          grep -qE 'path: /.well-known/communication-platform$' ingress-fed.yaml
          grep -qE 'path: /federation$' ingress-fed.yaml
          test "$(grep -c 'path:' ingress-fed.yaml)" = 3
          grep -qF 'identity-host-reaches-server: "true"' ingress-fed.yaml
          # sharedHost on a different host than the client's is refused, as is no host at all.
          if helm template ci-test charts/federated-chat-app $ONE --set server.ingress.host=other.example.com 2> shared.err; then echo "sharedHost with another host was accepted"; exit 1; fi
          grep -q 'sharedHost' shared.err
          if helm template ci-test charts/federated-chat-app $ONE --set client.ingress.host= 2> shared2.err; then echo "sharedHost with no host was accepted"; exit 1; fi
          grep -q 'sharedHost' shared2.err
          # The desktop app's origin: allowed by default, off on request, never twice, and an explicit list is kept.
          REQUIRED="--set domain=chat.example.com --set server.publicUrl=https://chat.example.com --set server.clientPublicUrl=https://chat.example.com --set secrets.jwtAccessSecret=a --set secrets.jwtRefreshSecret=b --set postgresql.auth.password=p"
          cors() { helm template ci-test charts/federated-chat-app $REQUIRED "$@" -s templates/server-deployment.yaml | grep -A1 'name: CORS_ORIGIN' | tail -1; }
          cors | grep -qF 'value: "https://chat.example.com,http://tauri.localhost"'
          cors --set server.desktopApp.enabled=false | grep -qF 'value: "https://chat.example.com"'
          cors --set 'server.extraCorsOrigins={http://tauri.localhost,https://x.example}' | grep -qF 'value: "https://chat.example.com,http://tauri.localhost,https://x.example"'
          cors --set server.desktopApp.enabled=false --set 'server.extraCorsOrigins={https://x.example}' | grep -qF 'value: "https://chat.example.com,https://x.example"'

  # --- Tests -------------------------------------------------------------

  unit-tests:
    name: Unit tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tier == 'full') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema server/prisma/schema.prisma
      # Pure-logic tests only (ids, federation signing/verification,
      # permission bitmasks, serialization) - no database needed. Coverage
      # here is informational only (no threshold) - this slice is
      # intentionally narrow, see the integration job for the enforced gate.
      - run: npm run test:coverage --workspace server
      - run: npm run test:coverage --workspace client
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: unit-coverage-reports
          path: |
            server/coverage/unit
            client/coverage
          retention-days: 14

  integration-tests:
    name: Integration tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tier == 'full') }}
    runs-on: ubuntu-latest
    # The job cannot start until both containers report healthy, and Docker only runs the first health
    # check one interval after the container starts - so a 5 s interval meant waiting at least 5 s for
    # Postgres even when it was ready in 2. Check every second instead; 50 retries keeps the same 50 s
    # of patience (the old 10 retries x 5 s) before giving up on a slow start.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
    env:
      DATABASE_URL: postgresql://chat:chat@localhost:5432/chat_test
      SERVER_DOMAIN: test.local
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      REGISTRATION_ENABLED: "true"
      CORS_ORIGIN: http://localhost:5173
      PUBLIC_BASE_URL: http://localhost:4000
      # Read only by test/integration/presenceFanout.test.ts, which points
      # REDIS_URL at this on its own - every other integration test runs
      # with REDIS_URL unset, exercising the single-replica (no Redis) path,
      # same as the rest of this suite always has.
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema server/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema server/prisma/schema.prisma
      # Exercises real routes against a real Postgres database (supertest +
      # the actual Express app, see server/test/) - auth, friends, DMs,
      # presence, and the federation protocol's signature verification and
      # security checks (domain spoofing, membership). Several of these are
      # regression tests for bugs found during this project's manual testing
      # history (message cross-contamination, presence protocolId mismatch,
      # invisible status leaking over REST) - see the comments in
      # server/test/integration/*.test.ts for each one's story.
      #
      # This also enforces the project's coverage floor (see the thresholds
      # in server/vitest.integration.config.ts) - it's the suite that
      # actually exercises the route handlers, so it's the meaningful
      # coverage number, not the unit suite's.
      - run: npm run test:integration:coverage --workspace server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: integration-coverage-report
          path: server/coverage/integration
          retention-days: 14

  # The real client in a real browser against two real homeservers (alice.test and bob.test, each with its own
  # database, talking over the signed federation protocol) - see docs/testing.md "End-to-end tests".
  #
  # NOT a required check yet, on purpose: a browser run that fails now and then for reasons unrelated to the change
  # would otherwise block every merge. Once it has run clean for a while, add "End-to-end tests" to the master
  # ruleset's required checks (and to the list in CLAUDE.md).
  e2e-tests:
    name: End-to-end tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tier == 'full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
    env:
      # The suite makes its own databases (chat_e2e_a / chat_e2e_b) on this server.
      E2E_DATABASE_URL_BASE: postgresql://chat:chat@localhost:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema server/prisma/schema.prisma
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # Voice channels (e2e/tests/voice.spec.ts): the LiveKit server calls go through. Its webhook reaches the e2e server on this machine.
      - name: Start LiveKit
        run: |
          docker compose -f e2e/docker-compose.livekit.yml up -d
          for i in $(seq 1 30); do curl -sf http://localhost:7880 && break; sleep 1; done
          curl -sf http://localhost:7880
      - run: npm run test --workspace e2e
        env:
          E2E_LIVEKIT: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  # --- Security ------------------------------------------------------------

  dependency-audit:
    name: Dependency vulnerability audit
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || contains(fromJSON('["full", "light"]'), needs.changes.outputs.tier)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review (PR diff)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || contains(fromJSON('["full", "light"]'), needs.changes.outputs.tier)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          # GHSA-wrw7-89jp-8q8g: moderate-severity soundness issue in
          # glib 0.18.5 (Iterator/DoubleEndedIterator impls for
          # glib::VariantStrIter) - a transitive, Linux-only dependency
          # pulled in by Tauri's own current webkit2gtk-rs chain
          # (client/src-tauri), not something this project depends on
          # directly. Confirmed via `cargo update` that no newer
          # compatible version exists anywhere in the tree - this is
          # purely waiting on an upstream Tauri/webkit2gtk-rs release, not
          # fixable from here. Remove this once that happens; every other
          # advisory still fails the check normally.
          allow-ghsas: GHSA-wrw7-89jp-8q8g

  secret-scan:
    name: Secret scanning
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tier != 'push') }}
    runs-on: ubuntu-latest
    # The action reads the pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
