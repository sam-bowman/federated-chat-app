name: Publish desktop app

on:
  push:
    tags:
      - "v*.*.*"
  # Lets you manually rebuild+republish an existing release's desktop
  # installers without cutting a new app version. When running this
  # manually, pick the actual git tag (not a branch) under "Use workflow
  # from", or there's no release for tauri-action to attach installers to.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and upload (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64 only for this first pass, matching the same
        # first-pass platform scoping already established for the native
        # binaries (publish-binaries.yml) - Intel Mac is a documented
        # follow-up, not attempted here, for consistency rather than a new
        # asymmetry. No explicit --target is passed anywhere: each leg
        # builds natively for whatever architecture its own runner is, no
        # cross-compilation, same reasoning as that workflow.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # https://v2.tauri.app/start/prerequisites/ - webkit2gtk-4.1 is the
      # version Tauri v2 needs (not 4.0, which was the v1-era package).
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # No `prisma generate` step here (unlike publish-images.yml/
      # publish-binaries.yml) - this only ever touches client/, which has
      # no Prisma dependency at all.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
