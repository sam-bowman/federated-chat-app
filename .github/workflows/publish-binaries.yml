name: Publish native binaries

on:
  push:
    tags:
      - "v*.*.*"
  # Lets you manually rebuild+republish an existing release's binaries
  # without cutting a new app version. When running this manually, pick the
  # actual git tag (not a branch) under "Use workflow from", or there's no
  # release for the upload step to attach assets to and no version to name
  # them with.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build and upload (${{ matrix.component }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # contents: write attaches the files to the release; id-token and attestations are for the signed provenance below.
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        component: [server, client]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Both components' build:binary scripts need this - the server's
      # bundles @prisma/client's JS directly and ships the native query
      # engine as a loose file (see CLAUDE.md), so it has to exist before
      # scripts/build-binary.mjs runs, same as a normal build.
      - run: npx prisma generate --schema server/prisma/schema.prisma

      - run: npm run build:binary --workspace ${{ matrix.component }}

      # One archive format (tar.gz) for all three OSes, rather than the
      # more usual zip-on-Windows/tar.gz-elsewhere split - `tar` ships as
      # part of Windows itself (since Win10 1803/Server 2019), unlike
      # `zip`, which isn't guaranteed present on every runner image and
      # isn't even on this Windows dev machine's own Git Bash.
      - name: Package release asset
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "${{ matrix.os }}" in
            windows-latest) platform=win32; arch=x64 ;;
            ubuntu-latest) platform=linux; arch=x64 ;;
            macos-latest) platform=darwin; arch=arm64 ;;
          esac
          name="federated-chat-app-${{ matrix.component }}-$version-$platform-$arch"
          cd "${{ matrix.component }}/dist-bin"
          tar -czf "../../$name.tar.gz" .
          echo "asset_path=$name.tar.gz" >> "$GITHUB_OUTPUT"

      # What the server or client binary is made of: a CycloneDX list of its production dependencies, taken from the lockfile (the
      # binary bundles them). It does not depend on the operating system, so it is made once per component, on the Linux leg, and
      # attached to the release next to the archives.
      - name: Make the software bill of materials
        id: sbom
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="federated-chat-app-${{ matrix.component }}-$version.sbom.cdx.json"
          npm sbom --workspace ${{ matrix.component }} --sbom-format cyclonedx --sbom-type application --omit dev --package-lock-only > "$name"
          echo "sbom_path=$name" >> "$GITHUB_OUTPUT"

      # A signed statement, made by this workflow and verifiable with `gh attestation verify`, that this archive was built here from this
      # repository. `continue-on-error`: see the same note in publish-images.yml; it has not run on a real release yet.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: ${{ steps.package.outputs.asset_path }}

      # Uploads to the release the triggering tag already has - release-please
      # creates both the tag and the GitHub Release together (see
      # docs/versioning.md), so by the time this runs there's always one to
      # attach to. The default GITHUB_TOKEN is enough here (unlike
      # release-please's own workflow): this only uploads an asset to an
      # already-existing release, it doesn't need to trigger anything else.
      - run: gh release upload "${{ github.ref_name }}" "${{ steps.package.outputs.asset_path }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: gh release upload "${{ github.ref_name }}" "${{ steps.sbom.outputs.sbom_path }}" --clobber
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
