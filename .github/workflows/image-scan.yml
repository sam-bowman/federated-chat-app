name: Image scan

# Looks for known vulnerabilities in the container images (#250). Three moments:
#   - a pull request that changes how an image is built or what goes into it: builds it and scans what it would publish;
#   - every Monday: scans what is PUBLISHED as `latest`, because new vulnerabilities are found in old images (an image that was clean
#     when it was released is not clean for ever), and the answer is then "make a release" or "rebuild";
#   - by hand.
# The same scan runs before a release's tags are made (publish-images.yml). What it reports and what fails is in
# .github/scripts/scan-image.sh, and docs/security.md explains how to read a finding.
#
# Deliberately NOT a required check: a new advisory in a base image would otherwise stop every unrelated pull request from merging.
# The result is on the pull request's checks and in the run's summary.
on:
  pull_request:
    paths:
      - server/Dockerfile
      - client/Dockerfile
      - client/nginx.conf
      - client/index.html
      - client/scripts/**
      - .github/scripts/check-client-headers.mjs
      - package-lock.json
      - server/prisma/**
      - .github/trivy/**
      - .github/scripts/scan-image.sh
      - .github/workflows/image-scan.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changed-image:
    name: Build and scan (${{ matrix.component }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [server, client]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # One architecture is enough: the packages are the same and the scan is of what they are.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: scan-${{ matrix.component }}:pr
          cache-from: type=gha,scope=${{ matrix.component }}-amd64
          cache-to: type=gha,mode=max,scope=scan-${{ matrix.component }}-amd64

      - name: Scan
        run: bash .github/scripts/scan-image.sh scan-${{ matrix.component }}:pr local

      # The client image's nginx must send the security headers on every kind of response, and its Content-Security-Policy must name exactly
      # the inline scripts of the page it serves (#281): a policy that does not would leave the page blank for everyone. Run for real here,
      # since nothing else in CI serves the built client (the end-to-end tests use the Vite dev server).
      - name: Check the client's security headers
        if: matrix.component == 'client'
        run: |
          docker run -d --name client-under-test -p 8080:8080 scan-client:pr
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          node .github/scripts/check-client-headers.mjs http://localhost:8080

  published-image:
    name: Scan the published ${{ matrix.component }} image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [server, client]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan
        run: bash .github/scripts/scan-image.sh ghcr.io/${{ github.repository_owner }}/federated-chat-app-${{ matrix.component }}:latest
