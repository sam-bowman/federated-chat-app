name: Publish Helm chart

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-push:
    name: Package and push
    runs-on: ubuntu-latest
    # id-token and attestations are for the signed provenance below; only this job asks for them.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - run: helm lint charts/federated-chat-app

      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      # Chart.yaml's own `version`/`appVersion` are already the exact
      # release version by the time this runs (release-please-config.json's
      # extra-files keeps them in lockstep - see docs/versioning.md) - no need
      # to override either at package time.
      - run: helm package charts/federated-chat-app --destination /tmp

      # Published as oci://ghcr.io/<owner>/charts/federated-chat-app - an
      # OCI registry push, not a traditional index.yaml chart repo (Helm
      # 3's native OCI support, no separate `helm repo add` needed):
      #   helm install my-chat oci://ghcr.io/sam-bowman/charts/federated-chat-app --version X.Y.Z
      # `helm push` prints the digest of what it pushed ("Digest: sha256:..."), which is what is signed below.
      - name: Push the chart
        id: push
        run: |
          set -euo pipefail
          helm push /tmp/federated-chat-app-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1 | tee /tmp/push.log
          digest="$(sed -n 's/^Digest: *//p' /tmp/push.log)"
          case "$digest" in sha256:*) ;; *) echo "helm push did not print a digest" >&2; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # A signed statement, made by this workflow and verifiable with `gh attestation verify oci://...`, that this chart was packaged here
      # from this repository. `continue-on-error`: see the same note in publish-images.yml; it has not run on a real release yet.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/federated-chat-app
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

