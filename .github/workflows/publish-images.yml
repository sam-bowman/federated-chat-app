name: Publish Docker images

on:
  push:
    tags:
      - "v*.*.*"
  # Lets you manually rebuild+republish an existing release's images without
  # cutting a new app version - e.g. after a base-image security patch. When
  # running this manually, pick the actual git tag (not a branch) under
  # "Use workflow from", or there's no version for the semver tags below to
  # derive from.
  #
  # Untick "push" to only check that every image builds (on any branch or tag):
  # nothing is pushed or tagged, and the merge step is skipped.
  workflow_dispatch:
    inputs:
      push:
        description: "Push the images (untick to only build them)"
        type: boolean
        default: true
      tag:
        description: "Publish under only this tag (e.g. 0.12.0-test) instead of the version tags and latest, to test publishing without touching a release's tags"
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  # A tag push always publishes; a manual run publishes unless "push" is unticked.
  PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}

# Each architecture is built on a runner of that architecture and the two are joined into one
# multi-arch tag afterwards, instead of building arm64 on an amd64 runner under QEMU emulation.
# The emulated arm64 build crashed intermittently in `npm ci` ("qemu: uncaught target signal 4
# (Illegal instruction)", Prisma's install step running its native engine) and then hung, with
# nothing failing, until someone cancelled it (#153); the client image had earlier hung under
# emulation too. Native builds have nothing to emulate, and are faster. GitHub's arm64 runners are
# free for public repositories.
jobs:
  build:
    name: Build (${{ matrix.component }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # A normal build takes 2-6 minutes. Anything far past that is stuck, so fail it instead of
    # letting it sit until someone notices.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [server, client]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only (no tag): the tags are applied once, to the combined image, by the
      # `merge` job below.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          # Attached to the image in the registry (one attestation manifest per architecture, which `imagetools create` below keeps in the
          # combined image): an SPDX list of what is in it, and how it was built. See docs/deployment/verifying-releases.md.
          sbom: true
          provenance: mode=max
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/federated-chat-app-${{ matrix.component }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}

      # Looks at the image that was just pushed (by digest: it has no tag yet) and stops here on a CRITICAL vulnerability that has a
      # fix. A failure fails this job, so the `merge` job never runs and no tag, `latest` included, points at the image. Rebuilding
      # picks up operating-system fixes (the Dockerfiles run `apk upgrade`); the rest is in .github/trivy/trivyignore and
      # docs/security.md.
      - name: Scan the image
        if: env.PUSH == 'true'
        run: bash .github/scripts/scan-image.sh "ghcr.io/${{ github.repository_owner }}/federated-chat-app-${{ matrix.component }}@${{ steps.build.outputs.digest }}"

      - name: Export the digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: env.PUSH == 'true'
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish (${{ matrix.component }})
    needs: build
    if: ${{ needs.build.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token and attestations are for the signed provenance below; only this job asks for them.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        component: [server, client]
    steps:
      # The tag input is for throwaway test tags; don't let it overwrite a release's tags.
      - name: Check the test tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" == latest || "$TAG" =~ ^v?[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::'$TAG' looks like a real release tag; use something like $TAG-test"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/federated-chat-app-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}},enable=${{ inputs.tag == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.tag == '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && inputs.tag == '' }}
            type=raw,value=${{ inputs.tag || 'unused' }},enable=${{ inputs.tag != '' }}

      # One tag that points at both architectures' images.
      - name: Create the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/federated-chat-app-${{ matrix.component }}
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          images=()
          for digest in *; do images+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"

      - name: Show the result
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/federated-chat-app-${{ matrix.component }}
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

      # A signed statement, made by this workflow and verifiable with `gh attestation verify`, that this image digest was built here from
      # this repository. It is about the combined image the tags point at. `continue-on-error`: the images are already published and
      # usable, so a problem here is shown as a failed step (orange, not a failed release) to look at, not a reason to hold a release;
      # it has not run on a real release yet.
      - name: Find the digest of the combined image
        id: index
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/federated-chat-app-${{ matrix.component }}
        run: echo "digest=$(docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/federated-chat-app-${{ matrix.component }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
