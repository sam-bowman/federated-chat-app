name: Publish Docker images

on:
  push:
    tags:
      - "v*.*.*"
  # Lets you manually rebuild+republish an existing release's images without
  # cutting a new app version - e.g. after a base-image security patch. When
  # running this manually, pick the actual git tag (not a branch) under
  # "Use workflow from", or there's no version for the semver tags below to
  # derive from.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [server, client]
    steps:
      - uses: actions/checkout@v4

      # Lets buildx produce the arm64 half of each image on these amd64
      # runners via emulation - slower than a native arm64 runner, but
      # simpler, and release builds aren't frequent enough for the extra
      # time to matter.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/federated-chat-app-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
