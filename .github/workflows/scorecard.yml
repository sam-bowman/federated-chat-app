name: Scorecard

# OpenSSF Scorecard (#250): a weekly report on the repository's own hygiene - branch protection, pinned actions, token permissions,
# dependency updates, signed releases and so on. It REPORTS and never blocks: it is not a required check, and it does not run on pull
# requests (the checks are about the repository, not about a change). The score is published to the OpenSSF's site, which is what a
# badge reads; see docs/security.md "Repository hygiene".
#
# Two jobs because a job that publishes its results may contain nothing but the Scorecard action's allowed steps (the OpenSSF's site
# refuses a workflow with a `run` step in it): the second job only reads what the first one saved.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Run Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Publishing the result signs it with this run's identity, which is how the OpenSSF's site knows it came from this repository.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.json
          results_format: json
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-results
          path: results.json
          retention-days: 30

  summary:
    name: Show the score
    needs: analysis
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: scorecard-results

      # Not uploaded to code scanning on purpose: each check below 10 would become an open alert beside CodeQL's, which are the ones that
      # block a merge and are looked at. The table is here, and the full report is on the OpenSSF's site.
      - name: Write the table
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const result = JSON.parse(readFileSync("results.json", "utf8"));
            const cell = (text) => String(text ?? "").replaceAll("|", "/").replaceAll("\n", " ");
            const lines = [
              "## OpenSSF Scorecard: " + result.score + " / 10",
              "",
              "| Check | Score | Why |",
              "| --- | --- | --- |",
              ...result.checks
                .slice()
                .sort((a, b) => a.score - b.score)
                .map((check) => "| " + cell(check.name) + " | " + (check.score < 0 ? "n/a" : check.score) + " | " + cell(check.reason) + " |"),
              "",
              "A score of -1 (n/a) means the check could not be run here. Full report: https://scorecard.dev/viewer/?uri=github.com/${{ github.repository }}",
            ];
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          '
