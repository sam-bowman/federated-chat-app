# Version updates (a pull request when a newer release of something we depend on exists). Security updates are a separate repository
# setting. Titles are Conventional Commits because the squash title becomes the commit on master and release-please reads it.
#
# What is deliberately held back:
#   - Node: the repository is on Node 22 everywhere (engines, .nvmrc, CI, the Dockerfiles). A new Node major, or @types/node for one, is a
#     decision (see scripts/check-node.mjs and CLAUDE.md), not an automatic pull request.
#   - Postgres and Redis images: a new major of either is a data migration for anyone running the compose files, not a version bump.
# Pull requests are kept few on purpose: each ecosystem opens at most a handful, and everything of one kind comes in ONE pull request
# (all minor and patch updates together; all major updates together; all base images together), not one per package. A major group that
# fails CI is split by hand, which is rarer than a week of single-package pull requests. A pull request left open stops further ones.
# New releases wait a few days (`cooldown`) before a pull request is opened, so a release that is pulled for a fault, or that turns out to
# be malicious, is usually gone by then. This does not delay security updates.
version: 2

updates:
  - package-ecosystem: npm
    # One entry for the whole workspace: from the root, Dependabot updates every workspace's package.json and the single root
    # package-lock.json together. Listing /server, /client and /e2e as well opened a second and third pull request for each package,
    # changing only a package.json and leaving the lockfile behind.
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Prisma 7 is a migration (datasource config and driver adapters), not a bump: see the issue "Migrate to Prisma 7".
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/client/src-tauri"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    cooldown:
      default-days: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    # /.github/trivy and /.github/zap are not built: the one FROM line in each is the pinned scanner (tag and digest), kept current here.
    directories: ["/server", "/client", "/.github/trivy", "/.github/zap"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    cooldown:
      default-days: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directories: ["/", "/e2e"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    cooldown:
      default-days: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
