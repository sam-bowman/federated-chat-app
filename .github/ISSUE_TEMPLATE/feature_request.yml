name: Feature request
description: Propose something new, or a change to how something works.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing or awkward today? Who runs into this, and when?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketch the behavior, API shape, or UI if you have one in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve this, and why you'd prefer the above.
    validations:
      required: false

  - type: dropdown
    id: roadmap
    attributes:
      label: Does this relate to a documented gap?
      description: See the README's "What's not here yet" / "Known federation limitations" sections.
      options:
        - Federated communities / group DMs
        - Remote message edit/delete/reactions propagation
        - Voice (WebRTC)
        - End-to-end encryption
        - Federation reliability (durable outbox, replay protection)
        - Something else not on the roadmap
        - Not sure
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
